<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hamihamoo — Photographs</title>
<meta name="theme-color" content="#0e0e0d">
<meta name="description" content="Hamihamoo Photography — 지나가는 순간들을, 오래 머무는 장면으로.">
<meta property="og:title" content="Hamihamoo Photography">
<meta property="og:description" content="지나가는 순간들을, 오래 머무는 장면으로.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@400&display=swap">
<link rel="stylesheet" href="app.css?v=3">
<script>
  // 저장된 밝기 모드를 화면이 그려지기 전에 적용해 깜빡임을 막아요.
  try { var t = localStorage.getItem('hm-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<header class="topbar" id="topbar">
  <a class="logo" href="#/" aria-label="홈으로">
    <span class="logo-mark" id="brandMark">h.</span>
    <span class="logo-name"><span id="brandName">Hamihamoo</span><small id="brandSub">PHOTOGRAPHY</small></span>
  </a>
  <div class="top-actions">
    <button class="icon-btn" id="aboutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg><span class="label">작가 소개</span></button>
    <button class="icon-btn" id="themeBtn" aria-label="밝기 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <a class="icon-btn outline" href="#/studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span class="label">관리</span></a>
  </div>
</header>

<nav class="dock" id="dock" aria-label="주요 메뉴">
  <span class="dock-ind" id="dockInd"></span>
  <a href="#/" data-route="home">Work</a>
  <a href="#/projects" data-route="projects">Projects</a>
  <a href="#/constellation" data-route="constellation">Constellation</a>
  <a href="#/guestbook" data-route="guestbook">Guestbook</a>
</nav>

<main id="view"></main>

<button class="to-top" id="topBtn" aria-label="맨 위로">
  <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="ring-bg" cx="24" cy="24" r="21"/><circle class="ring" id="topRing" cx="24" cy="24" r="21"/><path d="M24 31V17M18 23l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- 크게 보기 -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lb-stage" id="lbStage">
    <div class="lb-slidebar"><i id="lbSlideBar"></i></div>
    <div class="lb-top">
      <span class="mono" id="lbCounter"></span>
      <div class="lb-tools">
        <button class="icon-btn" id="lbPlay" title="슬라이드쇼 (Space)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
        <button class="icon-btn" id="lbShare" title="링크 복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
        <button class="icon-btn" id="lbFull" title="전체 화면 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="icon-btn" id="lbInfoBtn" title="사진 정보 (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.2"/></svg></button>
        <button class="icon-btn" id="lbClose" title="닫기 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="lb-strip" id="lbStrip"></div>
  <aside class="lb-info" id="lbInfo"></aside>
</div>

<!-- 작가 소개 -->
<div class="drawer-back" id="drawerBack"></div>
<aside class="drawer" id="drawer" aria-label="작가 소개">
  <button class="icon-btn drawer-close" id="drawerClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="drawerBody"></div>
</aside>

<div class="cursor" id="cursor">View</div>
<div class="toast" id="toast"></div>
<div class="curtain" id="curtain"></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js" defer></script>
<script src="app.js?v=3" defer></script>
</body>
</html>
