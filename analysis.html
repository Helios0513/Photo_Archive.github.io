<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>projects</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="journal.css">

<style>
/* =========================================================
   BASIC
========================================================= */

body.dark-mode {
    background:#111;
    color:#e9e9e9;
}

body.dark-mode .container {
    background:#181818;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

body.modal-open {
    overflow:hidden;
}

.project-page-wrap {
    width:100%;
    max-width:1100px;
    margin:0 auto;
}


/* =========================================================
   TOP
========================================================= */

.project-topbar {
    width:100%;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-bottom:20px;
}

.dark-toggle {
    background:#333;
    color:#fff;
    border:none;
    padding:10px 15px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.88rem;
}

body.dark-mode .dark-toggle {
    background:#eee;
    color:#111;
}


/* =========================================================
   PROJECT LIST HEADER
========================================================= */

.projects-heading {
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:38px;
}

.projects-heading-copy h1 {
    margin:0 0 8px 0;
    font-size:2.15rem;
    font-weight:600;
    letter-spacing:-0.04em;
    color:#222;
}

.projects-heading-copy p {
    margin:0;
    color:#777;
    font-size:0.95rem;
    line-height:1.7;
}

body.dark-mode .projects-heading-copy h1 {
    color:#fff;
}

body.dark-mode .projects-heading-copy p {
    color:#aaa;
}

.new-project-btn {
    flex-shrink:0;
    border:none;
    background:#222;
    color:#fff;
    padding:12px 18px;
    border-radius:999px;
    font-size:0.88rem;
    cursor:pointer;
    transition:0.2s ease;
}

.new-project-btn:hover {
    background:#444;
    transform:translateY(-1px);
}

body.dark-mode .new-project-btn {
    background:#eee;
    color:#111;
}


/* =========================================================
   PROJECT CARDS
========================================================= */

.project-grid {
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:44px 28px;
}

.project-card {
    min-width:0;
    cursor:pointer;
}

.project-cover {
    width:100%;
    aspect-ratio:3 / 2;
    overflow:hidden;
    background:#eee;
    position:relative;
}

body.dark-mode .project-cover {
    background:#262626;
}

.project-cover img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.55s ease;
}

.project-card:hover .project-cover img {
    transform:scale(1.025);
}

.project-card-info {
    padding-top:14px;
}

.project-card-title-row {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.project-card h2 {
    margin:0;
    color:#222;
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:-0.02em;
}

body.dark-mode .project-card h2 {
    color:#fff;
}

.project-count {
    color:#999;
    font-size:0.78rem;
    white-space:nowrap;
    padding-top:3px;
}

.project-subtitle {
    color:#777;
    font-size:0.88rem;
    line-height:1.5;
    margin-top:5px;
}

body.dark-mode .project-subtitle {
    color:#aaa;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-projects {
    border-top:1px solid #ddd;
    border-bottom:1px solid #ddd;
    padding:80px 20px;
    text-align:center;
    color:#888;
}

body.dark-mode .empty-projects {
    border-color:#333;
    color:#999;
}

.empty-projects-title {
    font-size:1.05rem;
    color:#444;
    margin-bottom:9px;
}

body.dark-mode .empty-projects-title {
    color:#ddd;
}

.empty-projects-text {
    font-size:0.88rem;
    line-height:1.7;
}


/* =========================================================
   PROJECT DETAIL
========================================================= */

.project-detail {
    animation:projectFade 0.3s ease;
}

@keyframes projectFade {
    from {
        opacity:0;
        transform:translateY(5px);
    }

    to {
        opacity:1;
        transform:translateY(0);
    }
}

.project-detail-toolbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:55px;
}

.project-back-btn {
    border:none;
    background:none;
    color:#666;
    cursor:pointer;
    padding:0;
    font-size:0.9rem;
}

body.dark-mode .project-back-btn {
    color:#bbb;
}


/* =========================================================
   PROJECT ADMIN MENU
========================================================= */

.project-menu-wrap {
    position:relative;
}

.project-menu-btn {
    width:40px;
    height:40px;
    border:1px solid #ddd;
    background:#fff;
    color:#444;
    border-radius:50%;
    cursor:pointer;
    font-size:1.05rem;
    line-height:1;
}

body.dark-mode .project-menu-btn {
    background:#1d1d1d;
    border-color:#444;
    color:#ddd;
}

.project-menu {
    position:absolute;
    top:48px;
    right:0;
    min-width:155px;
    padding:6px;
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:13px;
    box-shadow:0 10px 30px rgba(0,0,0,0.14);
    z-index:50;
    display:none;
}

.project-menu.open {
    display:block;
}

body.dark-mode .project-menu {
    background:#222;
    border-color:#3b3b3b;
}

.project-menu button {
    width:100%;
    border:none;
    background:none;
    padding:10px 12px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    color:#444;
    font-size:0.82rem;
}

.project-menu button:hover {
    background:#f3f3f3;
}

body.dark-mode .project-menu button {
    color:#ddd;
}

body.dark-mode .project-menu button:hover {
    background:#303030;
}

.project-menu button.delete {
    color:#b14a4a;
}


/* =========================================================
   PROJECT DETAIL CONTENT
========================================================= */

.project-detail-header {
    max-width:760px;
    margin:0 auto 70px auto;
    text-align:center;
}

.project-detail-header h1 {
    font-size:2.5rem;
    font-weight:500;
    letter-spacing:-0.04em;
    margin:0 0 12px;
    color:#222;
}

body.dark-mode .project-detail-header h1 {
    color:#fff;
}

.project-detail-subtitle {
    color:#888;
    font-size:0.95rem;
    margin-bottom:22px;
}

.project-detail-description {
    color:#555;
    font-size:0.96rem;
    line-height:1.9;
    max-width:650px;
    margin:0 auto;
}

body.dark-mode .project-detail-description {
    color:#bbb;
}

.project-photo-series {
    display:flex;
    flex-direction:column;
    gap:70px;
    padding-bottom:70px;
}

.project-series-photo {
    width:100%;
    text-align:center;
}

.project-series-photo img {
    display:block;
    max-width:100%;
    max-height:88vh;
    width:auto;
    height:auto;
    margin:0 auto;
    object-fit:contain;
}


/* =========================================================
   MODAL
========================================================= */

.project-modal {
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,0.58);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
}

.project-modal.open {
    display:flex;
}

.project-modal-panel {
    width:min(1080px, 100%);
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 24px 70px rgba(0,0,0,0.35);
}

body.dark-mode .project-modal-panel {
    background:#181818;
    color:#eee;
}

.project-modal-header {
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:20px 24px;
    background:rgba(255,255,255,0.97);
    border-bottom:1px solid #eee;
    backdrop-filter:blur(12px);
}

body.dark-mode .project-modal-header {
    background:rgba(24,24,24,0.97);
    border-color:#333;
}

.project-modal-header h2 {
    margin:0;
    font-size:1.2rem;
    color:#222;
}

body.dark-mode .project-modal-header h2 {
    color:#fff;
}

.modal-close-btn {
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:#f2f2f2;
    color:#333;
    cursor:pointer;
    font-size:1.15rem;
}

body.dark-mode .modal-close-btn {
    background:#292929;
    color:#eee;
}

.project-modal-body {
    padding:25px;
}


/* =========================================================
   EDITOR
========================================================= */

.editor-section {
    margin-bottom:32px;
}

.editor-section-title {
    font-size:0.76rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:#999;
    margin-bottom:13px;
}

.form-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-field {
    margin-bottom:15px;
}

.form-field.full {
    grid-column:1 / -1;
}

.form-field label {
    display:block;
    font-size:0.78rem;
    color:#777;
    margin-bottom:7px;
}

body.dark-mode .form-field label {
    color:#aaa;
}

.form-field input,
.form-field textarea,
.photo-month-filter {
    width:100%;
    box-sizing:border-box;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px 12px;
    background:#fff;
    color:#222;
    font:inherit;
    font-size:0.9rem;
    outline:none;
}

.form-field input:focus,
.form-field textarea:focus,
.photo-month-filter:focus {
    border-color:#777;
}

body.dark-mode .form-field input,
body.dark-mode .form-field textarea,
body.dark-mode .photo-month-filter {
    background:#202020;
    border-color:#3c3c3c;
    color:#eee;
}

.form-field textarea {
    resize:vertical;
    min-height:90px;
    line-height:1.6;
}

.token-section {
    background:#f7f7f7;
    border-radius:14px;
    padding:16px;
}

body.dark-mode .token-section {
    background:#222;
}

.token-help {
    color:#999;
    font-size:0.75rem;
    line-height:1.6;
    margin-top:6px;
}


/* =========================================================
   SELECTED PHOTOS
========================================================= */

.selected-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.selected-count {
    color:#777;
    font-size:0.82rem;
}

body.dark-mode .selected-count {
    color:#aaa;
}

.selected-strip {
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:2px 2px 10px;
    min-height:110px;
}

.selected-empty {
    width:100%;
    border:1px dashed #ccc;
    border-radius:12px;
    color:#999;
    padding:28px 15px;
    box-sizing:border-box;
    text-align:center;
    font-size:0.82rem;
}

body.dark-mode .selected-empty {
    border-color:#444;
}

.selected-card {
    position:relative;
    flex:0 0 120px;
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    background:#fff;
}

body.dark-mode .selected-card {
    background:#222;
    border-color:#444;
}

.selected-card.cover {
    border:2px solid #222;
}

body.dark-mode .selected-card.cover {
    border-color:#fff;
}

.selected-card img {
    width:100%;
    height:78px;
    object-fit:cover;
    display:block;
}

.selected-index {
    position:absolute;
    top:5px;
    left:5px;
    background:rgba(0,0,0,0.72);
    color:#fff;
    border-radius:999px;
    font-size:0.66rem;
    padding:3px 6px;
}

.cover-label {
    position:absolute;
    top:5px;
    right:5px;
    background:#fff;
    color:#111;
    border-radius:999px;
    font-size:0.61rem;
    padding:3px 6px;
}

.selected-actions {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-top:1px solid #eee;
}

body.dark-mode .selected-actions {
    border-color:#444;
}

.selected-actions button {
    border:none;
    border-right:1px solid #eee;
    background:#fff;
    height:29px;
    color:#555;
    cursor:pointer;
    font-size:0.72rem;
}

body.dark-mode .selected-actions button {
    background:#222;
    border-color:#444;
    color:#ddd;
}

.selected-actions button:last-child {
    border-right:none;
}


/* =========================================================
   PHOTO LIBRARY
========================================================= */

.photo-picker-toolbar {
    display:grid;
    grid-template-columns:190px 1fr;
    gap:10px;
    margin-bottom:12px;
}

.photo-search {
    width:100%;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px 13px;
    box-sizing:border-box;
    font-size:0.85rem;
    outline:none;
}

body.dark-mode .photo-search {
    background:#202020;
    border-color:#444;
    color:#eee;
}

.photo-library-box {
    border:1px solid #e3e3e3;
    border-radius:14px;
    overflow:hidden;
    background:#fafafa;
}

body.dark-mode .photo-library-box {
    border-color:#383838;
    background:#1d1d1d;
}

.photo-picker {
    height:430px;
    overflow-y:auto;
    padding:15px;
    box-sizing:border-box;
    overscroll-behavior:contain;
}

.photo-date-group {
    margin-bottom:24px;
}

.photo-date-group:last-child {
    margin-bottom:0;
}

.photo-date-title {
    position:sticky;
    top:-15px;
    z-index:3;
    font-size:0.74rem;
    font-weight:700;
    color:#777;
    background:rgba(250,250,250,0.95);
    backdrop-filter:blur(8px);
    padding:9px 0;
    margin-bottom:8px;
}

body.dark-mode .photo-date-title {
    color:#aaa;
    background:rgba(29,29,29,0.95);
}

.photo-picker-grid {
    display:grid;
    grid-template-columns:repeat(5, minmax(0, 1fr));
    gap:8px;
}

.picker-photo {
    position:relative;
    aspect-ratio:1 / 1;
    cursor:pointer;
    overflow:hidden;
    background:#eee;
    border-radius:7px;
    border:2px solid transparent;
    box-sizing:border-box;
}

body.dark-mode .picker-photo {
    background:#292929;
}

.picker-photo.selected {
    border-color:#111;
}

body.dark-mode .picker-photo.selected {
    border-color:#fff;
}

.picker-photo img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.picker-check {
    position:absolute;
    top:6px;
    right:6px;
    width:23px;
    height:23px;
    border-radius:50%;
    background:#fff;
    color:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:0.7rem;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.picker-photo:not(.selected) .picker-check {
    display:none;
}


/* =========================================================
   FOOTER
========================================================= */

.project-modal-footer {
    position:sticky;
    bottom:0;
    z-index:20;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    padding:17px 24px;
    background:rgba(255,255,255,0.97);
    border-top:1px solid #eee;
    backdrop-filter:blur(12px);
}

body.dark-mode .project-modal-footer {
    background:rgba(24,24,24,0.97);
    border-color:#333;
}

.editor-cancel-btn,
.editor-save-btn {
    border:none;
    border-radius:999px;
    padding:11px 18px;
    cursor:pointer;
    font-size:0.84rem;
}

.editor-cancel-btn {
    background:#eee;
    color:#333;
}

body.dark-mode .editor-cancel-btn {
    background:#2b2b2b;
    color:#ddd;
}

.editor-save-btn {
    background:#222;
    color:#fff;
    min-width:135px;
}

body.dark-mode .editor-save-btn {
    background:#eee;
    color:#111;
}

.editor-save-btn:disabled {
    opacity:0.55;
    cursor:not-allowed;
}

.project-message {
    flex:1;
    font-size:0.78rem;
    color:#777;
}

.project-message.error {
    color:#b64d4d;
}

.project-message.success {
    color:#34784b;
}

.projects-loading {
    padding:60px 20px;
    text-align:center;
    color:#999;
    font-size:0.88rem;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:900px) {

    .photo-picker-grid {
        grid-template-columns:repeat(4, minmax(0, 1fr));
    }
}


@media (max-width:768px) {

    .projects-heading {
        align-items:flex-start;
        margin-bottom:28px;
    }

    .projects-heading-copy h1 {
        font-size:1.75rem;
    }

    .projects-heading-copy p {
        font-size:0.86rem;
    }

    .new-project-btn {
        padding:10px 14px;
        font-size:0.78rem;
    }

    .project-grid {
        grid-template-columns:1fr;
        gap:38px;
    }

    .project-detail-toolbar {
        margin-bottom:42px;
    }

    .project-detail-header {
        margin-bottom:45px;
    }

    .project-detail-header h1 {
        font-size:2rem;
    }

    .project-photo-series {
        gap:42px;
    }

    .project-modal {
        padding:0;
    }

    .project-modal-panel {
        width:100%;
        height:100dvh;
        max-height:none;
        border-radius:0;
    }

    .project-modal-header {
        padding:15px 16px;
    }

    .project-modal-body {
        padding:18px 16px 25px;
    }

    .form-grid {
        grid-template-columns:1fr;
        gap:0;
    }

    .form-field.full {
        grid-column:auto;
    }

    .photo-picker-toolbar {
        grid-template-columns:135px 1fr;
        gap:7px;
    }

    .photo-month-filter,
    .photo-search {
        padding:10px;
        font-size:0.78rem;
    }

    .photo-picker {
        height:48vh;
        padding:10px;
    }

    .photo-picker-grid {
        grid-template-columns:repeat(3, minmax(0, 1fr));
        gap:5px;
    }

    .project-modal-footer {
        padding:12px 14px;
    }

    .project-message {
        display:none;
    }

    .selected-card {
        flex-basis:108px;
    }
}


@media (max-width:480px) {

    .projects-heading {
        flex-direction:column;
        align-items:stretch;
        gap:14px;
    }

    .new-project-btn {
        align-self:flex-start;
    }
}
</style>
</head>

            <img
                src="images/KakaoTalk_20240406_232152395.jpg"
                alt="프로필 사진"
                class="profile-img"
            >

            <div class="journal-brand-copy">
                <h2>Hamihamoo</h2>
                <p>Amateur Photographer</p>
            </div>

        </div>


        <nav>
            <ul>

        <div class="project-page-wrap">

            <div class="project-topbar">

                <button
                    class="dark-toggle"
                    onclick="toggleDark()"
                >
                    🌙 Dark
                </button>

            </div>


            <div id="projectArea">

                <div class="projects-loading">
                    projects loading...
                </div>

            </div>

        </div>

    </div>

</div>



<!-- =========================================================
     PROJECT EDITOR
========================================================= -->

<div
    class="project-modal"
    id="projectModal"
    aria-hidden="true"
>

    <div class="project-modal-panel">

        <div class="project-modal-header">

            <h2 id="editorTitle">
                New Project
            </h2>

            <button
                class="modal-close-btn"
                type="button"
                onclick="closeProjectEditor()"
            >
                ×
            </button>

        </div>


        <div class="project-modal-body">


            <!-- PROJECT INFORMATION -->

            <section class="editor-section">

                <div class="editor-section-title">
                    Project Information
                </div>


                <div class="form-grid">

                    <div class="form-field">

                        <label for="projectTitleInput">
                            Project title
                        </label>

                        <input
                            id="projectTitleInput"
                            type="text"
                            placeholder="Taipei, 2026"
                            maxlength="100"
                        >

                    </div>


                    <div class="form-field">

                        <label for="projectSubtitleInput">
                            Subtitle
                        </label>

                        <input
                            id="projectSubtitleInput"
                            type="text"
                            placeholder="September 2026"
                            maxlength="150"
                        >

                    </div>


                    <div class="form-field full">

                        <label for="projectDescriptionInput">
                            Description
                        </label>

                        <textarea
                            id="projectDescriptionInput"
                            placeholder="프로젝트에 대한 짧은 설명을 적어주세요."
                        ></textarea>

                    </div>

                </div>

            </section>



            <!-- GITHUB TOKEN -->

            <section class="editor-section token-section">

                <div class="editor-section-title">
                    GitHub
                </div>


                <div
                    class="form-field"
                    style="margin-bottom:0;"
                >

                    <label for="projectTokenInput">
                        GitHub token
                    </label>

                    <input
                        id="projectTokenInput"
                        type="password"
                        autocomplete="off"
                        placeholder="GitHub 토큰 입력"
                    >

                    <div
                        class="token-help"
                        id="tokenHelp"
                    >
                        현재 브라우저 탭을 사용하는 동안만 기억합니다.
                    </div>

                </div>

            </section>



            <!-- SELECTED -->

            <section class="editor-section">

                <div class="selected-header">

                    <div
                        class="editor-section-title"
                        style="margin:0;"
                    >
                        Selected Photos
                    </div>

                    <div
                        class="selected-count"
                        id="selectedCount"
                    >
                        0 selected
                    </div>

                </div>


                <div
                    class="selected-strip"
                    id="selectedStrip"
                ></div>

            </section>



            <!-- PHOTO LIBRARY -->

            <section class="editor-section">

                <div class="editor-section-title">
                    Photo Library
                </div>


                <div class="photo-picker-toolbar">

                    <select
                        class="photo-month-filter"
                        id="photoMonthFilter"
                    >
                        <option value="">
                            All Photos
                        </option>
                    </select>


                    <input
                        class="photo-search"
                        id="photoSearch"
                        type="search"
                        placeholder="날짜, 파일명, 카메라 검색"
                    >

                </div>


                <div class="photo-library-box">

                    <div
                        class="photo-picker"
                        id="photoPicker"
                    ></div>

                </div>

            </section>

        </div>



        <div class="project-modal-footer">

            <div
                class="project-message"
                id="projectMessage"
            ></div>


            <button
                class="editor-cancel-btn"
                type="button"
                onclick="closeProjectEditor()"
            >
                Cancel
            </button>


            <button

                id="saveProjectBtn"
                type="button"
                onclick="saveProject()"
            >
                Create Project
            </button>

        </div>

    </div>

</div>



<script>

/* =========================================================
   SETTINGS
========================================================= */

const repo =
    "Helios0513/Photo_Archive.github.io";

let allPhotos = [];

let projects = [];

let selectedPhotos = [];

let selectedCover = "";

let editingProjectId = null;

let currentPhotoFilter = "";

let currentMonthFilter = "";

let sessionGithubToken =
    sessionStorage.getItem(
        "photoArchiveGithubToken"
    ) || "";



/* =========================================================
   DARK MODE
========================================================= */

function toggleDark() {

    document.body.classList.toggle(
        "dark-mode"
    );

    localStorage.setItem(
        "dark",
        document.body.classList.contains(
            "dark-mode"
        )
    );

    updateDarkButtonText();
}


function updateDarkButtonText() {

    const button =
        document.querySelector(
            ".dark-toggle"
        );

    if (!button) return;

    button.innerHTML =
        document.body.classList.contains(
            "dark-mode"
        )
        ? "☀ Light"
        : "🌙 Dark";
}


if (
    localStorage.getItem("dark") ===
    "true"
) {

    document.body.classList.add(
        "dark-mode"
    );
}

updateDarkButtonText();



/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function photoUrl(filename) {

    return `images/digital/${encodeURIComponent(filename)}`;
}


function formatDescription(text) {

    return escapeHtml(
        text || ""
    ).replace(/\n/g, "<br>");
}


function createProjectId(title) {

    let slug =
        String(title || "")
            .toLowerCase()
            .trim()
            .replace(
                /[^a-z0-9가-힣]+/g,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                ""
            );


    if (!slug) {
        slug = "project";
    }


    return `${slug}-${Date.now()}`;
}


function getPhoto(filename) {

    return allPhotos.find(
        photo =>
            photo.filename === filename
    );
}


function showEditorMessage(
    message,
    type = ""
) {

    const box =
        document.getElementById(
            "projectMessage"
        );


    box.textContent =
        message;


    box.className =
        "project-message";


    if (type) {
        box.classList.add(type);
    }
}



/* =========================================================
   LOAD
========================================================= */

async function loadPhotos() {

    const response =
        await fetch(
            `photos.json?v=${Date.now()}`,
            {
                cache:"no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "photos.json을 불러오지 못했습니다."
        );
    }


    return await response.json();
}


async function loadProjects() {

    try {

        const response =
            await fetch(
                `projects.json?v=${Date.now()}`,
                {
                    cache:"no-store"
                }
            );


        if (
            response.status === 404
        ) {

            return [];
        }


        if (!response.ok) {
            return [];
        }


        const data =
            await response.json();


        return Array.isArray(data)
            ? data
            : [];

    } catch (error) {

        return [];
    }
}


async function initializeProjectsPage() {

    const area =
        document.getElementById(
            "projectArea"
        );


    try {

        const [
            photoData,
            projectData
        ] =
        await Promise.all([
            loadPhotos(),
            loadProjects()
        ]);


        allPhotos =
            photoData;

        projects =
            projectData;


        buildMonthFilter();

        renderProjects();

    } catch (error) {

        console.error(error);


        area.innerHTML = `

            <div class="empty-projects">

                <div class="empty-projects-title">
                    데이터를 불러오지 못했습니다.
                </div>

                <div class="empty-projects-text">
                    photos.json을 확인해주세요.
                </div>

            </div>
        `;
    }
}



/* =========================================================
   MONTH FILTER
========================================================= */

function buildMonthFilter() {

    const select =
        document.getElementById(
            "photoMonthFilter"
        );


    const months =
        [...new Set(

            allPhotos
                .map(photo => {

                    if (
                        !photo.date ||
                        photo.date.length < 7
                    ) {

                        return "";
                    }


                    return photo.date.slice(
                        0,
                        7
                    );
                })
                .filter(Boolean)

        )]
        .sort()
        .reverse();


    select.innerHTML =
        `
        <option value="">
            All Photos
        </option>
        `;


    months.forEach(month => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            month;

        option.textContent =
            month;


        select.appendChild(option);
    });
}



/* =========================================================
   PROJECT LIST
========================================================= */

function renderProjects() {

    const area =
        document.getElementById(
            "projectArea"
        );


    let html = `

        <div class="projects-heading">

            <div class="projects-heading-copy">

                <h1>
                    projects
                </h1>

                <p>
                    Photographs collected into stories and series.
                </p>

            </div>


            <button
                class="new-project-btn"
                onclick="openProjectEditor()"
            >
                + New Project
            </button>

        </div>
    `;


    if (!projects.length) {

        html += `

            <div class="empty-projects">

                <div class="empty-projects-title">
                    No projects yet.
                </div>

                <div class="empty-projects-text">
                    사진들을 하나의 이야기로 묶어<br>
                    첫 번째 프로젝트를 만들어보세요.
                </div>

            </div>
        `;


        area.innerHTML =
            html;

        return;
    }


    const sortedProjects =
        projects
            .slice()
            .sort(
                (a, b) => {

                    const aTime =
                        new Date(
                            a.createdAt || 0
                        ).getTime();


                    const bTime =
                        new Date(
                            b.createdAt || 0
                        ).getTime();


                    return (
                        bTime -
                        aTime
                    );
                }
            );


    html += `
        <div class="project-grid">
    `;


    sortedProjects.forEach(
        project => {

            const cover =
                project.cover ||
                (
                    project.photos &&
                    project.photos[0]
                ) ||
                "";


            const count =
                Array.isArray(
                    project.photos
                )
                ? project.photos.length
                : 0;


            html += `

                <article
                    class="project-card"
                    data-project-id="${escapeHtml(project.id)}"
                >

                    <div class="project-cover">

                        ${
                            cover
                            ?
                            `
                            <img
                                src="${photoUrl(cover)}"
                                alt="${escapeHtml(project.title)}"
                                loading="lazy"
                            >
                            `
                            :
                            ""
                        }

                    </div>


                    <div class="project-card-info">

                        <div class="project-card-title-row">

                            <h2>
                                ${escapeHtml(project.title)}
                            </h2>

                            <div class="project-count">
                                ${count} photographs
                            </div>

                        </div>


                        ${
                            project.subtitle
                            ?
                            `
                            <div class="project-subtitle">
                                ${escapeHtml(project.subtitle)}
                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                </article>
            `;
        }
    );


    html += `
        </div>
    `;


    area.innerHTML =
        html;


    area
        .querySelectorAll(
            ".project-card"
        )
        .forEach(
            card => {

                card.addEventListener(
                    "click",
                    () => {

                        openProject(
                            card.dataset.projectId
                        );
                    }
                );
            }
        );
}



/* =========================================================
   PROJECT DETAIL
========================================================= */

function openProject(projectId) {

    const project =
        projects.find(
            item =>
                item.id === projectId
        );


    if (!project) return;


    const area =
        document.getElementById(
            "projectArea"
        );


    let photosHtml = "";


    (
        project.photos || []
    ).forEach(
        filename => {

            const photo =
                getPhoto(filename);


            if (!photo) return;


            photosHtml += `

                <div class="project-series-photo">

                    <img
                        src="${photoUrl(filename)}"
                        alt=""
                        loading="lazy"
                    >

                </div>
            `;
        }
    );


    area.innerHTML = `

        <div class="project-detail">

            <div class="project-detail-toolbar">

                <button
                    class="project-back-btn"
                    onclick="renderProjects()"
                >
                    ← Projects
                </button>


                <div class="project-menu-wrap">

                    <button
                        class="project-menu-btn"
                        onclick="toggleProjectMenu(event)"
                        aria-label="Project settings"
                    >
                        •••
                    </button>


                    <div
                        class="project-menu"
                        id="projectMenu"
                    >

                        <button
                            onclick="openProjectEditor('${escapeHtml(project.id)}')"
                        >
                            Edit Project
                        </button>


                        <button
                            class="delete"
                            onclick="deleteProject('${escapeHtml(project.id)}')"
                        >
                            Delete Project
                        </button>

                    </div>

                </div>

            </div>


            <header class="project-detail-header">

                <h1>
                    ${escapeHtml(project.title)}
                </h1>


                ${
                    project.subtitle
                    ?
                    `
                    <div class="project-detail-subtitle">
                        ${escapeHtml(project.subtitle)}
                    </div>
                    `
                    :
                    ""
                }


                ${
                    project.description
                    ?
                    `
                    <div class="project-detail-description">
                        ${formatDescription(project.description)}
                    </div>
                    `
                    :
                    ""
                }

            </header>


            <div class="project-photo-series">

                ${photosHtml}

            </div>

        </div>
    `;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}



/* =========================================================
   ADMIN MENU
========================================================= */

function toggleProjectMenu(event) {

    event.stopPropagation();


    const menu =
        document.getElementById(
            "projectMenu"
        );


    if (!menu) return;


    menu.classList.toggle(
        "open"
    );
}


document.addEventListener(
    "click",
    event => {

        const menu =
            document.getElementById(
                "projectMenu"
            );


        if (!menu) return;


        const wrapper =
            event.target.closest(
                ".project-menu-wrap"
            );


        if (!wrapper) {

            menu.classList.remove(
                "open"
            );
        }
    }
);



/* =========================================================
   EDITOR OPEN
========================================================= */

function openProjectEditor(
    projectId = null
) {

    editingProjectId =
        projectId || null;


    const modal =
        document.getElementById(
            "projectModal"
        );


    const title =
        document.getElementById(
            "projectTitleInput"
        );


    const subtitle =
        document.getElementById(
            "projectSubtitleInput"
        );


    const description =
        document.getElementById(
            "projectDescriptionInput"
        );


    const tokenInput =
        document.getElementById(
            "projectTokenInput"
        );


    if (editingProjectId) {

        const project =
            projects.find(
                item =>
                    item.id ===
                    editingProjectId
            );


        if (!project) return;


        document.getElementById(
            "editorTitle"
        ).textContent =
            "Edit Project";


        document.getElementById(
            "saveProjectBtn"
        ).textContent =
            "Save Changes";


        title.value =
            project.title || "";


        subtitle.value =
            project.subtitle || "";


        description.value =
            project.description || "";


        selectedPhotos =
            Array.isArray(
                project.photos
            )
            ? [...project.photos]
            : [];


        selectedCover =
            project.cover ||
            selectedPhotos[0] ||
            "";

    } else {

        document.getElementById(
            "editorTitle"
        ).textContent =
            "New Project";


        document.getElementById(
            "saveProjectBtn"
        ).textContent =
            "Create Project";


        title.value = "";

        subtitle.value = "";

        description.value = "";

        selectedPhotos = [];

        selectedCover = "";
    }


    tokenInput.value =
        sessionGithubToken;


    if (sessionGithubToken) {

        document.getElementById(
            "tokenHelp"
        ).textContent =
            "이 탭에서 입력했던 토큰을 불러왔습니다.";

    } else {

        document.getElementById(
            "tokenHelp"
        ).textContent =
            "현재 브라우저 탭을 사용하는 동안만 기억합니다.";
    }


    currentPhotoFilter =
        "";

    currentMonthFilter =
        "";


    document.getElementById(
        "photoSearch"
    ).value =
        "";


    document.getElementById(
        "photoMonthFilter"
    ).value =
        "";


    showEditorMessage("");


    renderSelectedPhotos();

    renderPhotoPicker();


    modal.classList.add(
        "open"
    );


    modal.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.classList.add(
        "modal-open"
    );
}



/* =========================================================
   EDITOR CLOSE
========================================================= */

function closeProjectEditor() {

    const modal =
        document.getElementById(
            "projectModal"
        );


    modal.classList.remove(
        "open"
    );


    modal.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.classList.remove(
        "modal-open"
    );
}



/* =========================================================
   SELECTED PHOTOS
========================================================= */

function renderSelectedPhotos() {

    const strip =
        document.getElementById(
            "selectedStrip"
        );


    const count =
        document.getElementById(
            "selectedCount"
        );


    count.textContent =
        `${selectedPhotos.length} selected`;


    if (!selectedPhotos.length) {

        strip.innerHTML = `

            <div class="selected-empty">
                아래 Photo Library에서
                프로젝트에 넣을 사진을 선택하세요.
            </div>
        `;

        return;
    }


    strip.innerHTML =
        selectedPhotos
            .map(
                (filename, index) => {

                    const cover =
                        filename ===
                        selectedCover;


                    return `

                        <div
                            class="selected-card ${cover ? "cover" : ""}"
                            data-filename="${escapeHtml(filename)}"
                        >

                            <img
                                src="${photoUrl(filename)}"
                                alt=""
                            >


                            <div class="selected-index">
                                ${index + 1}
                            </div>


                            ${
                                cover
                                ?
                                `
                                <div class="cover-label">
                                    cover
                                </div>
                                `
                                :
                                ""
                            }


                            <div class="selected-actions">

                                <button
                                    type="button"
                                    data-action="left"
                                >
                                    ←
                                </button>

                                <button
                                    type="button"
                                    data-action="right"
                                >
                                    →
                                </button>

                                <button
                                    type="button"
                                    data-action="cover"
                                >
                                    ★
                                </button>

                                <button
                                    type="button"
                                    data-action="remove"
                                >
                                    ×
                                </button>

                            </div>

                        </div>
                    `;
                }
            )
            .join("");
}



/* =========================================================
   PHOTO PICKER
========================================================= */

function renderPhotoPicker() {

    const picker =
        document.getElementById(
            "photoPicker"
        );


    const search =
        currentPhotoFilter
            .trim()
            .toLowerCase();


    const filtered =
        allPhotos
            .filter(
                photo => {

                    if (
                        currentMonthFilter
                    ) {

                        if (
                            !photo.date ||
                            !photo.date.startsWith(
                                currentMonthFilter
                            )
                        ) {

                            return false;
                        }
                    }


                    if (!search) {

                        return true;
                    }


                    const searchable =
                        [
                            photo.filename,
                            photo.date,
                            photo.info,
                            photo.color
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return searchable.includes(
                        search
                    );
                }
            )
            .slice()
            .sort(
                (a, b) => {

                    const dateCompare =
                        String(
                            b.date || ""
                        )
                        .localeCompare(
                            String(
                                a.date || ""
                            )
                        );


                    if (
                        dateCompare !== 0
                    ) {

                        return dateCompare;
                    }


                    return String(
                        a.filename || ""
                    ).localeCompare(
                        String(
                            b.filename || ""
                        )
                    );
                }
            );


    if (!filtered.length) {

        picker.innerHTML = `

            <div class="selected-empty">
                표시할 사진이 없습니다.
            </div>
        `;

        return;
    }


    const groups = {};


    filtered.forEach(
        photo => {

            const date =
                photo.date ||
                "Unknown Date";


            if (!groups[date]) {

                groups[date] =
                    [];
            }


            groups[date].push(
                photo
            );
        }
    );


    let html = "";


    Object.entries(
        groups
    ).forEach(
        ([date, photos]) => {

            html += `

                <section class="photo-date-group">

                    <div class="photo-date-title">
                        ${escapeHtml(date)}
                    </div>


                    <div class="photo-picker-grid">
            `;


            photos.forEach(
                photo => {

                    const selected =
                        selectedPhotos.includes(
                            photo.filename
                        );


                    html += `

                        <div
                            class="picker-photo ${selected ? "selected" : ""}"
                            data-filename="${escapeHtml(photo.filename)}"
                        >

                            <img
                                src="${photoUrl(photo.filename)}"
                                alt=""
                                loading="lazy"
                            >


                            <div class="picker-check">
                                ✓
                            </div>

                        </div>
                    `;
                }
            );


            html += `

                    </div>

                </section>
            `;
        }
    );


    picker.innerHTML =
        html;
}



/* =========================================================
   SELECT / ORDER / COVER
========================================================= */

function togglePhotoSelection(
    filename
) {

    const index =
        selectedPhotos.indexOf(
            filename
        );


    if (index === -1) {

        selectedPhotos.push(
            filename
        );


        if (!selectedCover) {

            selectedCover =
                filename;
        }

    } else {

        selectedPhotos.splice(
            index,
            1
        );


        if (
            selectedCover ===
            filename
        ) {

            selectedCover =
                selectedPhotos[0] ||
                "";
        }
    }


    renderSelectedPhotos();

    renderPhotoPicker();
}


function moveSelected(
    filename,
    direction
) {

    const index =
        selectedPhotos.indexOf(
            filename
        );


    if (index === -1) {
        return;
    }


    const target =
        index + direction;


    if (
        target < 0 ||
        target >=
        selectedPhotos.length
    ) {

        return;
    }


    [
        selectedPhotos[index],
        selectedPhotos[target]
    ] =
    [
        selectedPhotos[target],
        selectedPhotos[index]
    ];


    renderSelectedPhotos();
}


function removeSelected(
    filename
) {

    const index =
        selectedPhotos.indexOf(
            filename
        );


    if (
        index === -1
    ) {

        return;
    }


    selectedPhotos.splice(
        index,
        1
    );


    if (
        selectedCover ===
        filename
    ) {

        selectedCover =
            selectedPhotos[0] ||
            "";
    }


    renderSelectedPhotos();

    renderPhotoPicker();
}


function setCover(
    filename
) {

    if (
        !selectedPhotos.includes(
            filename
        )
    ) {

        return;
    }


    selectedCover =
        filename;


    renderSelectedPhotos();
}



/* =========================================================
   FILTER EVENTS
========================================================= */

document
    .getElementById(
        "photoSearch"
    )
    .addEventListener(
        "input",
        event => {

            currentPhotoFilter =
                event.target.value;


            renderPhotoPicker();
        }
    );


document
    .getElementById(
        "photoMonthFilter"
    )
    .addEventListener(
        "change",
        event => {

            currentMonthFilter =
                event.target.value;


            renderPhotoPicker();
        }
    );



/* =========================================================
   PHOTO EVENTS
========================================================= */

document
    .getElementById(
        "photoPicker"
    )
    .addEventListener(
        "click",
        event => {

            const card =
                event.target.closest(
                    ".picker-photo"
                );


            if (!card) return;


            togglePhotoSelection(
                card.dataset.filename
            );
        }
    );


document
    .getElementById(
        "selectedStrip"
    )
    .addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    "button[data-action]"
                );


            if (!button) return;


            const card =
                button.closest(
                    ".selected-card"
                );


            if (!card) return;


            const filename =
                card.dataset.filename;


            const action =
                button.dataset.action;


            if (
                action === "left"
            ) {

                moveSelected(
                    filename,
                    -1
                );
            }


            if (
                action === "right"
            ) {

                moveSelected(
                    filename,
                    1
                );
            }


            if (
                action === "cover"
            ) {

                setCover(
                    filename
                );
            }


            if (
                action === "remove"
            ) {

                removeSelected(
                    filename
                );
            }
        }
    );



/* =========================================================
   MODAL EVENTS
========================================================= */

document

/* =========================================================
   GITHUB
========================================================= */

function encodeBase64Utf8(
    text
) {

    return btoa(
        unescape(
            encodeURIComponent(
                text
            )
        )
    );
}


async function saveProjectsToGithub(
    token,
    message,
    projectData
) {

    const apiUrl =
        `https://api.github.com/repos/${repo}/contents/projects.json`;


    let sha = null;


    const getResponse =
        await fetch(
            apiUrl,
            {
                headers:{
                    "Authorization":
                        `token ${token}`,

                    "Accept":
                        "application/vnd.github+json"
                }
            }
        );


    if (
        getResponse.ok
    ) {

        const currentFile =
            await getResponse.json();


        sha =
            currentFile.sha;

    } else if (
        getResponse.status !== 404
    ) {

        let errorMessage =
            "projects.json을 확인하지 못했습니다.";


        try {

            const data =
                await getResponse.json();


            if (
                data.message
            ) {

                errorMessage =
                    data.message;
            }

        } catch (error) {}


        throw new Error(
            errorMessage
        );
    }


    const body = {

        message:message,

        content:
            encodeBase64Utf8(
                JSON.stringify(
                    projectData,
                    null,
                    2
                )
            )
    };


    if (sha) {

        body.sha =
            sha;
    }


    const saveResponse =
        await fetch(
            apiUrl,
            {
                method:"PUT",

                headers:{

                    "Authorization":
                        `token ${token}`,

                    "Accept":
                        "application/vnd.github+json",

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        body
                    )
            }
        );


    if (
        !saveResponse.ok
    ) {

        let errorMessage =
            "GitHub 저장에 실패했습니다.";


        try {

            const data =
                await saveResponse.json();


            if (
                data.message
            ) {

                errorMessage =
                    data.message;
            }

        } catch (error) {}


        throw new Error(
            errorMessage
        );
    }


    return await saveResponse.json();
}



/* =========================================================
   SAVE PROJECT
========================================================= */

async function saveProject() {

    const title =
        document
            .getElementById(
                "projectTitleInput"
            )
            .value
            .trim();


    const subtitle =
        document
            .getElementById(
                "projectSubtitleInput"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "projectDescriptionInput"
            )
            .value
            .trim();


    const token =
        document
            .getElementById(
                "projectTokenInput"
            )
            .value
            .trim();


    if (!title) {

        showEditorMessage(
            "Project title을 입력해주세요.",
            "error"
        );

        return;
    }


    if (
        !selectedPhotos.length
    ) {

        showEditorMessage(
            "사진을 한 장 이상 선택해주세요.",
            "error"
        );

        return;
    }


    if (!token) {

        showEditorMessage(
            "GitHub 토큰을 입력해주세요.",
            "error"
        );

        return;
    }


    sessionGithubToken =
        token;


    sessionStorage.setItem(
        "photoArchiveGithubToken",
        token
    );


    if (
        !selectedCover
    ) {

        selectedCover =
            selectedPhotos[0];
    }


    const button =
        document.getElementById(
            "saveProjectBtn"
        );


    button.disabled =
        true;


    showEditorMessage(
        "GitHub에 저장하는 중..."
    );


    try {

        const now =
            new Date().toISOString();


        let nextProjects =
            [...projects];


        if (
            editingProjectId
        ) {

            const index =
                nextProjects.findIndex(
                    item =>
                        item.id ===
                        editingProjectId
                );


            if (
                index === -1
            ) {

                throw new Error(
                    "프로젝트를 찾을 수 없습니다."
                );
            }


            nextProjects[index] = {

                ...nextProjects[index],

                title:title,

                subtitle:subtitle,

                description:
                    description,

                cover:
                    selectedCover,

                photos:[
                    ...selectedPhotos
                ],

                updatedAt:
                    now
            };

        } else {

            nextProjects.push({

                id:
                    createProjectId(
                        title
                    ),

                title:title,

                subtitle:
                    subtitle,

                description:
                    description,

                cover:
                    selectedCover,

                photos:[
                    ...selectedPhotos
                ],

                createdAt:
                    now,

                updatedAt:
                    now
            });
        }


        await saveProjectsToGithub(

            sessionGithubToken,

            editingProjectId
                ? `Update project: ${title}`
                : `Create project: ${title}`,

            nextProjects
        );


        projects =
            nextProjects;


        showEditorMessage(
            "저장되었습니다.",
            "success"
        );


        setTimeout(
            () => {

                closeProjectEditor();

                renderProjects();

            },
            300
        );

    } catch (error) {

        console.error(error);


        showEditorMessage(
            `저장 실패: ${error.message}`,
            "error"
        );

    } finally {

        button.disabled =
            false;
    }
}



/* =========================================================
   DELETE
========================================================= */

async function deleteProject(
    projectId
) {

    const project =
        projects.find(
            item =>
                item.id ===
                projectId
        );


    if (!project) {
        return;
    }


    const confirmed =
        confirm(
            `"${project.title}" 프로젝트를 삭제할까요?\n\n원본 사진은 삭제되지 않습니다.`
        );


    if (!confirmed) {
        return;
    }


    let token =
        sessionGithubToken;


    if (!token) {

        token =
            prompt(
                "GitHub 토큰을 입력해주세요."
            ) || "";
    }


    token =
        token.trim();


    if (!token) {
        return;
    }


    sessionGithubToken =
        token;


    sessionStorage.setItem(
        "photoArchiveGithubToken",
        token
    );


    const nextProjects =
        projects.filter(
            item =>
                item.id !==
                projectId
        );


    try {

        await saveProjectsToGithub(

            token,

            `Delete project: ${project.title}`,

            nextProjects
        );


        projects =
            nextProjects;


        renderProjects();


        alert(
            "프로젝트가 삭제되었습니다.\n원본 사진은 그대로 유지됩니다."
        );

    } catch (error) {

        alert(
            `프로젝트 삭제 실패:\n${error.message}`
        );
    }
}
