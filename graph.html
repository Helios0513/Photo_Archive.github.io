.timeline{position:absolute;z-index:22;left:32px;bottom:25px;width:275px;padding:10px 12px;border:1px solid #deded8;background:rgba(255,255,255,.92);backdrop-filter:blur(13px)}.timeline-head{display:flex;justify-content:space-between;margin-bottom:7px;color:#8a8a82;font-size:8px;letter-spacing:.12em}.year-list{gap:4px;overflow:auto;scrollbar-width:none}.year-btn{flex:0 0 auto;border-color:transparent;padding:5px 7px;background:transparent;color:#77776f;font-size:9px}.year-btn.active{color:#111;border-color:#c8c8c1;background:#f4f4f0}
.layer-bar{position:absolute;z-index:22;left:50%;bottom:24px;transform:translateX(-50%);gap:5px;padding:6px;border:1px solid #deded8;background:rgba(255,255,255,.92);backdrop-filter:blur(13px)}.layer-btn{border-color:transparent;padding:8px 10px;background:transparent;color:#77776f;font-size:8px;letter-spacing:.11em}.layer-btn.active{color:#318f5d;border-color:#a8cdb7;background:#f1f8f4}
.panel{position:absolute;z-index:28;top:82px;right:0;bottom:0;width:360px;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);border-left:1px solid #deded8;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);overflow:auto;box-shadow:-16px 0 42px rgba(0,0,0,.045)}.panel.open{transform:translateX(0)}.panel-head{position:sticky;top:0;z-index:2;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e4de;background:rgba(255,255,255,.96)}.panel-head span{color:#8a8a82;font-size:8px;letter-spacing:.16em}.panel-head button{border:0;background:none;color:#77776f;font-size:20px}
.panel-head-actions{display:flex;align-items:center;gap:8px}
.panel-toggle{display:none!important;font-size:8px!important;letter-spacing:.11em!important;color:#77776f!important;padding:5px 7px!important;border:1px solid #d7d7d1!important}.panel-image{width:100%;max-height:320px;object-fit:cover;background:#f0f0ec}.panel-body{padding:20px}.panel-no{color:#999991;font-size:8px}.panel-date{margin-top:8px;color:#252521;font:400 28px/1 Georgia,serif}.panel-location{margin-top:8px;color:#6f6f68;font-size:11px;line-height:1.6}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.chip{padding:5px 7px;border:1px solid #d8d8d2;color:#6f6f68;background:#fafaf7;font-size:8px}.meta{margin-top:20px;border-top:1px solid #deded8}.meta-row{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #e9e9e4}.meta-row b{color:#96968d;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:400}.meta-row span{color:#44443f;font-size:10px;line-height:1.5}.related-title{margin:23px 0 10px;color:#8a8a82;font-size:8px;letter-spacing:.13em}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.related div{aspect-ratio:1/1;overflow:hidden;background:#f1f1ed;cursor:pointer}.related img{width:100%;height:100%;object-fit:cover;opacity:.88}.related div:hover img{opacity:1}.panel-actions{display:flex;gap:7px;margin-top:18px}.panel-actions button{flex:1;padding:9px;border:1px solid #d2d2cb;background:#fff;color:#44443f;font-size:9px}.panel-actions button:hover{border-color:#77776f;color:#111}

body.mobile-panel-open .timeline{bottom:170px}
body.mobile-panel-expanded .timeline{opacity:0;pointer-events:none}.lb-grid{display:block}.lb-stage{height:100%}.lb-info{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;border:0;background:linear-gradient(to top,rgba(5,7,8,.96),rgba(5,7,8,.6),transparent)}.lb-date{font-size:22px}.lb-meta{margin-top:7px;font-size:9px}}

<body>
<div class="app">
<canvas id="graphCanvas"></canvas>

<header class="header">
    <a class="brand" href="index.html">
        <div class="mark" id="brandMark">h.</div>
        <div><strong id="brandName">hamihamoo</strong><small id="brandSubtitle">PHOTOGRAPHY</small></div>
        <div class="brand-title" id="graphTitle">PHOTO GRAPH</div>
    </a>
    <div class="actions">
        <a class="btn archive-link" href="index.html" aria-label="사진 아카이브로 돌아가기">

            <span class="archive-short">←</span>

    </div>

<div class="top-controls simple-search">

        <input id="searchInput" type="search" placeholder="날짜 · 장소 · 프로젝트 · 파일명 검색">

    </div>
</div>

<div class="stats"><strong id="statCount">0</strong><span id="statCopy">photographs · 0 connections</span></div>

<div class="timeline">
    <div class="timeline-head"><span>TIME FIELD</span><span id="activeYearLabel">ALL YEARS</span></div>
    <div class="year-list" id="yearList"></div>
</div>



<aside class="panel" id="infoPanel">
    <div class="panel-head">
        <span>SELECTED PHOTOGRAPH</span>
        <div class="panel-head-actions">
            <button class="panel-toggle" id="panelToggle" type="button">DETAIL</button>

        </div>
    </div>
    <img class="panel-image" id="panelImage" alt="">
    <div class="panel-body">
        <div class="panel-no" id="panelNumber"></div>
        <div class="panel-date" id="panelDate"></div>
        <div class="panel-location" id="panelLocation"></div>
        <div class="chips" id="panelProjects"></div>
        <div class="meta">
            <div class="meta-row"><b>Camera</b><span id="panelCamera">-</span></div>
            <div class="meta-row"><b>Color</b><span id="panelColor">-</span></div>
            <div class="meta-row"><b>Connections</b><span id="panelConnections">-</span></div>
        </div>
        <div class="related-title">STRONGEST CONNECTIONS</div>
        <div class="related" id="relatedList"></div>
        <div class="panel-actions">
            <button id="openSelectedBtn">Open</button>
            <button id="focusSelectedBtn" title="선택한 노드가 정면을 향하도록 3D 필드를 회전">Center</button>
        </div>
    </div>
</aside>

<div class="tooltip" id="tooltip">
    <img id="tooltipImage" alt="">
    <div class="tooltip-body"><div class="tooltip-date" id="tooltipDate"></div><div class="tooltip-copy" id="tooltipCopy"></div></div>
</div>

    <button class="lightbox-close" id="lightboxClose">×</button>

            <button class="lb-prev" id="lbPrev">‹</button>
            <img class="lb-image" id="lightboxImage" alt="">
            <button class="lb-next" id="lbNext">›</button>
        </div>
        <div class="lb-info"><div class="lb-no" id="lbNumber"></div><div class="lb-date" id="lbDate"></div><div class="lb-meta" id="lbMeta"></div></div>
    </div>
</div>
</div>

<script>
const canvas=document.getElementById("graphCanvas"),ctx=canvas.getContext("2d");
let photos=[],projects=[],nodes=[],edges=[],allRelations=[],projectMap=new Map(),photoProjectMap=new Map();
let activeYear="all",selectedNode=null,hoveredNode=null,currentSearch="";
let orbitMap=new Map();
let ambientRotationEnabled=true;
let cloudRotationY=0;
let cloudRotationX=-0.18;
let cloudRotationZ=0;
let cloudFocusAnimating=false;
let centeredNode=null;
let focusAnimationToken=0;

const cloudExtentX=430;
const cloudExtentY=330;
const cloudExtentZ=390;
const cloudDepthRange=520;
const cloudPerspective=1150;
let width=innerWidth,height=innerHeight,dpr=Math.max(1,Math.min(2,devicePixelRatio||1)),simulationTicks=0;
let camera={x:width/2,y:height/2,zoom:1};
let pointer={down:false,moved:false,lastX:0,lastY:0,x:0,y:0,active:false,id:null,type:"mouse",downNode:null,draggingNode:null,longPressTimer:null,moveX:0,moveY:0,lastMoveTime:0,speed:0,energy:0};
const activePointers=new Map();
let pinch={active:false,startDistance:0,startZoom:1,worldX:0,worldY:0};
let lightboxIndex=-1;

const safe=v=>String(v??"");
const photoUrl=f=>"images/digital/"+encodeURIComponent(f);
const formatDate=v=>safe(v).replace(/-/g,".");
const getYear=p=>(safe(p.date).match(/^(\d{4})/)||[])[1]||"";
const getLocation=p=>{const l=p.location||{};return l.displayName||[l.region,l.city,l.district,l.country].filter(Boolean).join(" ")||""};
const getLatLng=p=>{const l=p.location||{},lat=Number(l.latitude),lng=Number(l.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null};
const getCamera=p=>{const t=safe(p.info).trim(),m=t.match(/\bf\d+(\.\d+)?\b/i);return m?(t.slice(0,m.index).trim()||t):(t||"-")};
const normalizeColor=v=>{const x=safe(v).trim();if(/^#[0-9a-f]{6}$/i.test(x))return x;if(/^#[0-9a-f]{3}$/i.test(x))return "#"+x.slice(1).split("").map(c=>c+c).join("");const n={red:"#b65a52",orange:"#c77d42",yellow:"#c8b653",green:"#5f8d67",blue:"#5c7899",purple:"#7b668d",pink:"#b87c8d",brown:"#7f6754",black:"#3d4143",white:"#d9d9d3",gray:"#858b8e",grey:"#858b8e"};return n[x.toLowerCase()]||"#9aa3a8"};
const hexToRgb=h=>{h=normalizeColor(h).slice(1);return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}};
const colorDistance=(a,b)=>{const x=hexToRgb(a),y=hexToRgb(b);return Math.hypot(x.r-y.r,x.g-y.g,x.b-y.b)};
const projectIdsFor=f=>photoProjectMap.get(f)||[];
const sameProject=(a,b)=>{const s=new Set(projectIdsFor(a.filename));return projectIdsFor(b.filename).some(id=>s.has(id))};
const samePlace=(a,b)=>{const x=getLocation(a),y=getLocation(b);return x&&y&&x===y};
function dateScore(a,b){const x=safe(a.date),y=safe(b.date);if(!x||!y)return 0;if(x===y)return 5;if(x.slice(0,7)===y.slice(0,7))return 2.2;if(x.slice(0,4)===y.slice(0,4))return .6;return 0}
function relation(a,b,L="all"){const d=dateScore(a,b),p=samePlace(a,b)?5:0,j=sameProject(a,b)?6:0,cd=colorDistance(a.color,b.color),c=cd<55?3.2:cd<90?1.8:cd<125?.7:0,e=getCamera(a)===getCamera(b)?1.5:0;let w=0;if(L==="all")w=d+p+j+c+e;if(L==="date")w=d;if(L==="place")w=p;if(L==="project")w=j;if(L==="color")w=c;if(L==="exif")w=e;return{weight:w,date:d,place:p,project:j,color:c,exif:e}}
const visibleNodes=()=>nodes.filter(n=>activeYear==="all"||getYear(n.photo)===activeYear);
function searchMatch(n){if(!currentSearch)return true;const p=n.photo,pt=projectIdsFor(p.filename).map(id=>projectMap.get(id)?.title||"").join(" ");return[p.filename,p.date,p.info,p.color,getLocation(p),pt].filter(Boolean).join(" ").toLowerCase().includes(currentSearch)}

function buildProjectMaps(){projectMap.clear();photoProjectMap.clear();projects.forEach(p=>{projectMap.set(p.id,p);(p.photos||[]).forEach(f=>{if(!photoProjectMap.has(f))photoProjectMap.set(f,[]);photoProjectMap.get(f).push(p.id)})})}
function hashStringSeed(text){
    let h=2166136261;
    const s=String(text||"");
    for(let i=0;i<s.length;i++){
        h^=s.charCodeAt(i);
        h=Math.imul(h,16777619);
    }
    return h>>>0;
}

function mulberry32(seed){
    return function(){
        let t=seed+=0x6D2B79F5;
        t=Math.imul(t^t>>>15,t|1);
        t^=t+Math.imul(t^t>>>7,t|61);
        return((t^t>>>14)>>>0)/4294967296;
    };
}

function buildNodes(){
    nodes=photos.map((photo,id)=>{
        // 파일명을 seed로 사용해서 새로고침해도 같은 3D 배치를 유지.
        const rand=mulberry32(hashStringSeed(`${photo.filename}-${id}`));

        // 완벽한 구 표면이 아니라 3D 공간 내부에 불규칙하게 분포.
        const zDir=rand()*2-1;
        const angle=rand()*Math.PI*2;
        const ring=Math.sqrt(Math.max(0,1-zDir*zDir));

        // 중심에도 일부 노드가 있고 바깥에도 일부 노드가 생기는 볼륨 분포.
        const radius=.22+.78*Math.pow(rand(),.52);

        const jitterX=.72+rand()*.56;
        const jitterY=.72+rand()*.56;
        const jitterZ=.72+rand()*.56;

        let sx=Math.cos(angle)*ring*cloudExtentX*radius*jitterX;
        let sy=zDir*cloudExtentY*radius*jitterY;
        let sz=Math.sin(angle)*ring*cloudExtentZ*radius*jitterZ;

        // 구형 윤곽을 깨기 위한 비대칭 오프셋.
        sx+=(rand()-.5)*105;
        sy+=(rand()-.5)*80;
        sz+=(rand()-.5)*115;

        // 소수의 노드는 조금 더 바깥으로 빠져나가게 해서 자연스러운 3D field 느낌.
        if(rand()<.16){
            const burst=1.08+rand()*.26;
            sx*=burst;
            sy*=burst;
            sz*=burst;
        }

        return{
            id,photo,
            sx,sy,sz,
            x:sx,y:sy,homeX:sx,homeY:sy,
            vx:0,vy:0,
            ox:0,oy:0,ovx:0,ovy:0,
            orbitMix:0,
            orbitTarget:0
        };
    });
}

function buildEdges(){
    const v=visibleNodes(),c=[];

    for(let i=0;i<v.length;i++){
        for(let j=i+1;j<v.length;j++){
            const rel=relation(v[i].photo,v[j].photo,"all");
            if(rel.weight>0){
                c.push({a:v[i],b:v[j],...rel});
            }
        }
    }

    c.sort((a,b)=>b.weight-a.weight);
    allRelations=c;
    edges=[];

    const degree=new Map();
    const maxEdges=Math.min(115,Math.max(55,Math.floor(v.length*.60)));

    function tryAdd(edge,minWeight){
        if(edges.length>=maxEdges)return false;
        if(edge.weight<minWeight)return false;

        const da=degree.get(edge.a.id)||0;
        const db=degree.get(edge.b.id)||0;
        if(da>=2||db>=2)return false;

        // 매우 긴 선은 정말 강한 관계일 때만 남긴다.
        const dist=Math.hypot(edge.b.sx-edge.a.sx,edge.b.sy-edge.a.sy,edge.b.sz-edge.a.sz);
        if(dist>520&&edge.weight<6)return false;

        edges.push(edge);
        degree.set(edge.a.id,da+1);
        degree.set(edge.b.id,db+1);
        return true;
    }

    // 먼저 강한 관계만.
    for(const edge of c){
        tryAdd(edge,4.4);
        if(edges.length>=maxEdges)break;
    }

    // 너무 비어 보이는 경우에만 중간 강도의 관계를 약간 보충.
    const minimum=Math.min(78,Math.floor(v.length*.42));
    if(edges.length<minimum){
        for(const edge of c){
            if(edges.includes(edge))continue;
            tryAdd(edge,3.15);
            if(edges.length>=minimum)break;
        }
    }

    refreshOrbitTargets();
    simulationTicks=0;
    updateStats();
}

const worldToScreen=(x,y)=>({x:x*camera.zoom+camera.x,y:y*camera.zoom+camera.y});
const screenToWorld=(x,y)=>({x:(x-camera.x)/camera.zoom,y:(y-camera.y)/camera.zoom});
function animateCamera(target,d=500){const s={...camera},t0=performance.now();function f(now){const t=Math.min(1,(now-t0)/d),e=1-Math.pow(1-t,3);camera.x=s.x+(target.x-s.x)*e;camera.y=s.y+(target.y-s.y)*e;camera.zoom=s.zoom+(target.zoom-s.zoom)*e;if(t<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function resetCamera(){animateCamera({x:width/2,y:height/2,zoom:1})}

function rotateCloudPoint(n){
    let x=n.sx,y=n.sy,z=n.sz;

    // Y rotation
    const cy=Math.cos(cloudRotationY),sy=Math.sin(cloudRotationY);
    let x1=x*cy+z*sy;
    let z1=-x*sy+z*cy;

    // X rotation
    const cx=Math.cos(cloudRotationX),sx=Math.sin(cloudRotationX);
    let y2=y*cx-z1*sx;
    let z2=y*sx+z1*cx;

    // 아주 약한 Z rotation까지 더해 "원판 회전" 느낌을 제거.
    const cz=Math.cos(cloudRotationZ),sz=Math.sin(cloudRotationZ);
    const x3=x1*cz-y2*sz;
    const y3=x1*sz+y2*cz;

    return{x:x3,y:y3,z:z2};
}

function projectedCloudWorld(n){
    const r=rotateCloudPoint(n);
    const perspective=cloudPerspective/(cloudPerspective-r.z);

    return{
        x:r.x*perspective,
        y:r.y*perspective,
        z:r.z,
        perspective,
        depth:Math.max(0,Math.min(1,(r.z+cloudDepthRange)/(cloudDepthRange*2)))
    };
}

function rawCloudScreen(n){
    const p=projectedCloudWorld(n);

    return{
        x:p.x*camera.zoom+camera.x+(n.ox||0)*camera.zoom,
        y:p.y*camera.zoom+camera.y+(n.oy||0)*camera.zoom,
        z:p.z,
        depth:p.depth,
        scale:p.perspective
    };
}

function centerOnNode(n,z=Math.max(camera.zoom,1.35)){
    if(!n)return;

    centeredNode=n;

    const targetYRaw=Math.atan2(-n.sx,n.sz);
    const targetX=Math.atan2(n.sy,Math.hypot(n.sx,n.sz));

    const twoPi=Math.PI*2;
    const turns=Math.round((cloudRotationY-targetYRaw)/twoPi);
    const targetY=targetYRaw+turns*twoPi;

    const startY=cloudRotationY;
    const startX=cloudRotationX;
    const startZ=cloudRotationZ;

    const startCamera={...camera};
    const mobile=window.matchMedia("(max-width:700px)").matches;
    const targetCamera={
        x:width/2,
        y:mobile ? Math.max(170,(height-125)/2) : height/2,
        zoom:Math.max(1,Math.min(2.15,z))
    };

    cloudFocusAnimating=true;
    const token=++focusAnimationToken;
    const begin=performance.now();
    const duration=620;

    function tick(now){
        if(token!==focusAnimationToken)return;

        const t=Math.min(1,(now-begin)/duration);
        const e=1-Math.pow(1-t,3);

        cloudRotationY=startY+(targetY-startY)*e;
        cloudRotationX=startX+(targetX-startX)*e;
        cloudRotationZ=startZ+(0-startZ)*e;

        camera.x=startCamera.x+(targetCamera.x-startCamera.x)*e;
        camera.y=startCamera.y+(targetCamera.y-startCamera.y)*e;
        camera.zoom=startCamera.zoom+(targetCamera.zoom-startCamera.zoom)*e;

        if(t<1){
            requestAnimationFrame(tick);
        }else{
            cloudFocusAnimating=false;
        }
    }

    requestAnimationFrame(tick);
}



function applyCursorSweepImpulse(x,y,dx,dy,dt){
    if(pointer.type!=="mouse"||pointer.down||pinch.active)return;

    const speed=Math.hypot(dx,dy)/Math.max(8,dt);
    pointer.speed=speed;
    if(speed<0.30)return;

    const radius=205;
    const speedPower=Math.min(1.25,(speed-.30)/1.20);
    if(speedPower<=0)return;

    pointer.energy=Math.max(pointer.energy,Math.min(1,speedPower));

    visibleNodes().forEach(n=>{
        if(n===pointer.draggingNode)return;

        const p=screenPosition(n);
        let tx=x-p.x,ty=y-p.y;
        const dist=Math.hypot(tx,ty);
        if(!dist||dist>=radius)return;

        const falloff=Math.pow(1-dist/radius,2);
        tx/=dist;ty/=dist;

        const impulse=(2.15*speedPower*falloff)/Math.max(.55,camera.zoom);
        n.ovx=(n.ovx||0)+tx*impulse;
        n.ovy=(n.ovy||0)+ty*impulse;
    });
}

function strongestConnections(n){
    if(!n)return[];
    return allRelations
        .filter(e=>e.a===n||e.b===n)
        .map(e=>({
            node:e.a===n?e.b:e.a,
            weight:e.weight,
            edge:e
        }))
        .sort((a,b)=>b.weight-a.weight);
}

function refreshOrbitTargets(){
    orbitMap.clear();

    // 선택이 바뀔 때 이전 ORBIT 상태를 완전히 초기화한다.
    // 이전 선택의 orbitMix가 새 선택으로 넘어가면 안 된다.
    nodes.forEach(n=>{
        n.orbitTarget=0;
        n.orbitMix=0;
    });

    if(!selectedNode)return;

    strongestConnections(selectedNode)
        .filter(item=>item.node!==selectedNode)
        .filter(item=>visibleNodes().includes(item.node))
        .slice(0,6)
        .forEach((item,index)=>{
            orbitMap.set(item.node.id,index);
            item.node.orbitTarget=1;
        });
}

function updateOrbitMotion(){
    nodes.forEach(n=>{
        const target=(selectedNode&&orbitMap.has(n.id)&&n!==selectedNode)?1:0;
        n.orbitTarget=target;
        n.orbitMix+=(target-n.orbitMix)*.10;

        if(Math.abs(target-n.orbitMix)<.0005){
            n.orbitMix=target;
        }
    });
}

function screenPosition(n,now=performance.now()){
    const base=rawCloudScreen(n);

    let x=base.x;
    let y=base.y;
    let z=base.z;
    let depth=base.depth;
    let scale=base.scale;

    const idx=orbitMap.get(n.id);
    const canOrbit=
        selectedNode &&
        n!==selectedNode &&
        idx!==undefined &&
        Number.isFinite(idx) &&
        n.orbitMix>.001;

    if(canOrbit){
        const center=rawCloudScreen(selectedNode);

        const ring=idx<4?92:137;
        const localIndex=idx<4?idx:idx-4;
        const groupCount=idx<4
            ? Math.min(4,orbitMap.size)
            : Math.max(1,orbitMap.size-4);

        const direction=idx%2===0?1:-1;
        const angle=(localIndex/Math.max(1,groupCount))*Math.PI*2 + now*.00018*direction;

        const tx=center.x+Math.cos(angle)*ring;
        const ty=center.y+Math.sin(angle)*ring;

        x+=(tx-x)*n.orbitMix;
        y+=(ty-y)*n.orbitMix;
        z+=(center.z-z)*n.orbitMix*.55;
        depth+=(center.depth-depth)*n.orbitMix*.55;
        scale+=(center.scale-scale)*n.orbitMix*.55;
    }

    // 방어 코드: Canvas에 NaN/Infinity 좌표가 절대 전달되지 않게 한다.
    if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(z)){
        return{
            x:Number.isFinite(base.x)?base.x:camera.x,
            y:Number.isFinite(base.y)?base.y:camera.y,
            z:Number.isFinite(base.z)?base.z:0,
            depth:Number.isFinite(base.depth)?base.depth:.5,
            scale:Number.isFinite(base.scale)?base.scale:1
        };
    }

    return{x,y,z,depth,scale};
}

function screenDeltaToCloudLocal(dx,dy){
    // 화면에서 움직인 벡터를 현재 3D cloud 회전의 반대 방향으로 되돌린다.
    let x=dx/Math.max(.01,camera.zoom);
    let y=dy/Math.max(.01,camera.zoom);
    let z=0;

    // inverse Z
    const cz=Math.cos(-cloudRotationZ),sz=Math.sin(-cloudRotationZ);
    const x1=x*cz-y*sz;
    const y1=x*sz+y*cz;

    // inverse X
    const cx=Math.cos(-cloudRotationX),sx=Math.sin(-cloudRotationX);
    const y2=y1*cx-z*sx;
    const z2=y1*sx+z*cx;

    // inverse Y
    const cy=Math.cos(-cloudRotationY),sy=Math.sin(-cloudRotationY);
    const x3=x1*cy+z2*sy;
    const z3=-x1*sy+z2*cy;

    return{x:x3,y:y2,z:z3};
}

function updateCursorOffsets(){
    const spring=.21;
    const damping=.70;
    const maxScreenOffset=32;

    nodes.forEach(n=>{
        if(n===pointer.draggingNode){
            n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;
            return;
        }

        n.ovx=(n.ovx||0)-(n.ox||0)*spring;
        n.ovy=(n.ovy||0)-(n.oy||0)*spring;
        n.ovx*=damping;
        n.ovy*=damping;
        n.ox=(n.ox||0)+n.ovx;
        n.oy=(n.oy||0)+n.ovy;

        const maxWorld=maxScreenOffset/Math.max(.45,camera.zoom);
        const d=Math.hypot(n.ox,n.oy);
        if(d>maxWorld){
            n.ox=n.ox/d*maxWorld;
            n.oy=n.oy/d*maxWorld;
        }

        if(Math.abs(n.ox)<.002&&Math.abs(n.oy)<.002&&Math.abs(n.ovx)<.002&&Math.abs(n.ovy)<.002){
            n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;
        }
    });

    pointer.energy*=.84;
    if(pointer.energy<.01)pointer.energy=0;
}


function applyAmbientRotation(){
    if(!ambientRotationEnabled||cloudFocusAnimating||centeredNode)return;

    const now=performance.now();

    // 한 축만 도는 원판 느낌이 아니라 3D 공간 덩어리 자체가 천천히 떠다니며 회전.
    cloudRotationY+=.00025;
    cloudRotationX=-.18+Math.sin(now*.000095)*.075;
    cloudRotationZ=Math.sin(now*.000061)*.045;
}

function simulate(){
    if(!visibleNodes().length)return;

    applyAmbientRotation();
    updateOrbitMotion();
    updateCursorOffsets();
}

function drawPointerField(){
    if(pointer.energy<=0||pointer.type!=="mouse"||pointer.down||pinch.active)return;

    const r=72+pointer.energy*46;
    const a=.018+.042*pointer.energy;
    const g=ctx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,r);
    g.addColorStop(0,`rgba(49,143,93,${a})`);
    g.addColorStop(.55,`rgba(49,143,93,${a*.30})`);
    g.addColorStop(1,"rgba(49,143,93,0)");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(pointer.x,pointer.y,r,0,Math.PI*2);
    ctx.fill();
}
function drawBackground(){
    ctx.clearRect(0,0,width,height);

    // 완벽한 구 윤곽은 그리지 않는다.
    // 대신 서로 다른 위치/크기의 매우 약한 공간 glow만 겹쳐서 깊이만 암시.
    const glows=[
        {x:camera.x-110*camera.zoom,y:camera.y-55*camera.zoom,r:420*camera.zoom,a:.018},
        {x:camera.x+135*camera.zoom,y:camera.y+80*camera.zoom,r:350*camera.zoom,a:.014},
        {x:camera.x+10*camera.zoom,y:camera.y-140*camera.zoom,r:285*camera.zoom,a:.010}
    ];

    glows.forEach(g=>{
        const grad=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);
        grad.addColorStop(0,`rgba(55,68,61,${g.a})`);
        grad.addColorStop(1,"rgba(55,68,61,0)");
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.arc(g.x,g.y,g.r,0,Math.PI*2);
        ctx.fill();
    });
}
function drawNebula(){
    if(camera.zoom<.55)return;

    visibleNodes().forEach((n,i)=>{
        if(i%4)return;

        const p=screenPosition(n);
        const rgb=hexToRgb(n.photo.color);
        const r=28*camera.zoom*Math.max(.65,Math.min(1.35,p.scale));
        const alpha=.016+.032*p.depth;
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);

        g.addColorStop(0,`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`);
        g.addColorStop(1,`rgba(${rgb.r},${rgb.g},${rgb.b},0)`);

        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fill();
    });
}

function drawEdges(){
    const visibleSet=new Set(visibleNodes().map(n=>n.id));

    edges.forEach(e=>{
        if(!visibleSet.has(e.a.id)||!visibleSet.has(e.b.id))return;

        const a=screenPosition(e.a);
        const b=screenPosition(e.b);

        const touchesSelected=selectedNode&&(e.a===selectedNode||e.b===selectedNode);
        const depth=(a.depth+b.depth)/2;

        let alpha=(.025+e.weight*.008)*(.28+.72*depth);
        alpha=Math.min(.15,alpha);

        if(selectedNode&&!touchesSelected)alpha*=.52;
        if(touchesSelected)alpha=.16+.12*depth;

        ctx.strokeStyle=`rgba(86,96,91,${alpha})`;
        ctx.lineWidth=.5+.25*depth;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
    });

    if(!selectedNode)return;

    strongestConnections(selectedNode).slice(0,6).forEach((item,index)=>{
        const a=screenPosition(selectedNode);
        const b=screenPosition(item.node);
        const depth=(a.depth+b.depth)/2;
        const alpha=(.52-index*.04)*(.70+.30*depth);

        ctx.strokeStyle=`rgba(49,143,93,${Math.max(.34,alpha)})`;
        ctx.lineWidth=.9+.35*depth;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
    });
}

function drawNodes(){
    const now=performance.now();

    const prepared=visibleNodes()
        .map(n=>({n,p:screenPosition(n,now)}))
        .sort((a,b)=>a.p.z-b.p.z);

    prepared.forEach(({n,p},i)=>{
        if(p.x<-60||p.x>width+60||p.y<30||p.y>height+60)return;

        const match=searchMatch(n);
        const sel=selectedNode===n;
        const hover=hoveredNode===n;
        const orbiting=orbitMap.has(n.id);

        let alpha=(.20+.80*p.depth);
        alpha*=match?1:.12;

        // 선택한 노드/ORBIT은 더 밝고 크게 강조하되,
        // 나머지 노드는 그대로 남겨 전체 3D field가 검게 사라지지 않게 한다.

        const rgb=hexToRgb(n.photo.color);
        const depthScale=.60+p.depth*.72;
        const perspectiveScale=Math.max(.72,Math.min(1.35,p.scale));
        const r=(sel?7.6:hover?5.8:orbiting?4.5:3.15)
            *depthScale
            *perspectiveScale
            *Math.max(.78,Math.min(1.45,camera.zoom));

        if(sel||hover||orbiting){
            const haloAlpha=sel?.17:(orbiting?.10:.07)*(.45+.55*p.depth);

            ctx.fillStyle=sel
                ?"rgba(49,143,93,.14)"
                :`rgba(${rgb.r},${rgb.g},${rgb.b},${haloAlpha})`;

            ctx.beginPath();
            ctx.arc(p.x,p.y,r*(sel?3.2:2.5),0,Math.PI*2);
            ctx.fill();
        }

        ctx.fillStyle=sel
            ?"rgba(49,143,93,1)"
            :orbiting
                ?`rgba(${rgb.r},${rgb.g},${rgb.b},${Math.max(.62,alpha)})`
                :`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;

        ctx.beginPath();
        ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fill();

        // 밝은 색 노드도 흰 배경에서 사라지지 않도록 아주 얇은 윤곽선을 준다.
        ctx.strokeStyle=sel
            ?"rgba(35,112,71,.62)"
            :`rgba(45,49,46,${.08+.10*p.depth})`;
        ctx.lineWidth=sel?1.15:.55;
        ctx.stroke();

        // 앞쪽 노드만 확대 상태에서 날짜 라벨 표시.
        if(i%7===0&&camera.zoom>1.65&&match&&!selectedNode&&p.depth>.62){
            ctx.fillStyle=`rgba(55,55,50,${.30+.38*p.depth})`;
            ctx.font="7px Arial";
            ctx.fillText(formatDate(n.photo.date),p.x+7,p.y+3);
        }
    });
}

function loop(){simulate();drawBackground();drawNebula();drawEdges();drawPointerField();drawNodes();requestAnimationFrame(loop)}
function hitTest(x,y){
    let best=null;
    let bestScore=Infinity;

    for(const n of visibleNodes()){
        const p=screenPosition(n);
        const orbiting=orbitMap.has(n.id);
        const depthScale=.65+p.depth*.65;
        const limit=Math.max(
            orbiting?14:10,
            (orbiting?10:7)*camera.zoom*depthScale
        );

        const d=Math.hypot(x-p.x,y-p.y);
        if(d>limit)continue;

        // 겹치면 앞쪽 노드를 우선 선택.
        const score=d-p.depth*4;
        if(score<bestScore){
            best=n;
            bestScore=score;
        }
    }

    return best;
}

function tooltipFor(n,x,y){const t=document.getElementById("tooltip");if(!n){t.classList.remove("show");return}document.getElementById("tooltipImage").src=photoUrl(n.photo.filename);document.getElementById("tooltipDate").textContent=formatDate(n.photo.date)||"Undated";document.getElementById("tooltipCopy").textContent=[getLocation(n.photo),getCamera(n.photo)].filter(Boolean).join(" · ");t.style.left=Math.min(width-184,x+14)+"px";t.style.top=Math.min(height-160,y+14)+"px";t.classList.add("show")}
function setSelected(n,center=false){
    if(centeredNode!==n)centeredNode=null;

    // 이전 Center 애니메이션의 마지막 프레임이 새 선택을 덮어쓰는 것을 막는다.
    focusAnimationToken++;
    cloudFocusAnimating=false;

    selectedNode=n;
    refreshOrbitTargets();

    if(!n){
        centeredNode=null;
        document.getElementById("infoPanel").classList.remove("open","expanded");
        document.body.classList.remove("mobile-panel-open","mobile-panel-expanded");
        if(typeof panelToggle!=="undefined")panelToggle.textContent="DETAIL";
        return;
    }

    if(center)centerOnNode(n);

    const p=n.photo;
    const ids=projectIdsFor(p.filename);
    const rel=strongestConnections(n);

    panelImage.src=photoUrl(p.filename);
    panelNumber.textContent=`PHOTO ${String(n.id+1).padStart(3,"0")}`;
    panelDate.textContent=formatDate(p.date)||"Undated";
    panelLocation.textContent=getLocation(p)||"Location unavailable";
    panelCamera.textContent=getCamera(p);
    panelColor.textContent=normalizeColor(p.color);
    panelConnections.textContent=`${Math.min(6,rel.length)} orbit connections`;

    panelProjects.innerHTML=ids
        .map(id=>`<span class="chip">${escapeHtml(projectMap.get(id)?.title||"Project")}</span>`)
        .join("");

    relatedList.innerHTML=rel.slice(0,6)
        .map(x=>`<div data-node="${x.node.id}"><img src="${photoUrl(x.node.photo.filename)}" alt=""></div>`)
        .join("");

    infoPanel.classList.add("open");

    if(window.matchMedia("(max-width:700px)").matches){
        infoPanel.classList.remove("expanded");
        panelToggle.textContent="DETAIL";
        document.body.classList.add("mobile-panel-open");
        document.body.classList.remove("mobile-panel-expanded");
    }
}

function escapeHtml(v){return safe(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function clearLongPress(){if(pointer.longPressTimer){clearTimeout(pointer.longPressTimer);pointer.longPressTimer=null}}
function startNodeDrag(n){if(!n)return;centeredNode=null;pointer.draggingNode=n;n.vx=0;n.vy=0;n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;n.orbitMix=0;n.orbitTarget=0;simulationTicks=0;canvas.classList.add("dragging")}
function stopNodeDrag(){if(pointer.draggingNode){pointer.draggingNode.vx=0;pointer.draggingNode.vy=0;pointer.draggingNode=null;simulationTicks=300}canvas.classList.remove("dragging")}
function beginPinch(){if(activePointers.size<2)return;const pts=[...activePointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,w=screenToWorld(cx,cy);pinch={active:true,startDistance:Math.max(1,Math.hypot(dx,dy)),startZoom:camera.zoom,worldX:w.x,worldY:w.y};clearLongPress();stopNodeDrag();pointer.moved=true}
function updatePinch(){if(!pinch.active||activePointers.size<2)return;const pts=[...activePointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,dist=Math.max(1,Math.hypot(dx,dy)),z=Math.max(.28,Math.min(4.2,pinch.startZoom*(dist/pinch.startDistance)));camera.zoom=z;camera.x=cx-pinch.worldX*z;camera.y=cy-pinch.worldY*z}
canvas.addEventListener("pointerdown",e=>{
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});canvas.setPointerCapture(e.pointerId);
    pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;pointer.type=e.pointerType||"mouse";
    if(activePointers.size===2){beginPinch();return}
    pointer.down=true;pointer.id=e.pointerId;pointer.moved=false;pointer.lastX=e.clientX;pointer.lastY=e.clientY;pointer.downNode=hitTest(e.clientX,e.clientY);

    if(!pointer.downNode){
        centeredNode=null;
    }
    if(pointer.type==="mouse"&&pointer.downNode)startNodeDrag(pointer.downNode);
    else if(pointer.type==="touch"&&pointer.downNode){clearLongPress();pointer.longPressTimer=setTimeout(()=>{if(pointer.down&&!pointer.moved&&activePointers.size===1){startNodeDrag(pointer.downNode);if(navigator.vibrate)navigator.vibrate(12)}},280)}
});
canvas.addEventListener("pointermove",e=>{
    if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});

    const now=performance.now();
    const prevX=pointer.x,prevY=pointer.y;
    const dt=pointer.lastMoveTime?now-pointer.lastMoveTime:16;
    const mdx=e.clientX-prevX,mdy=e.clientY-prevY;

    pointer.x=e.clientX;
    pointer.y=e.clientY;
    pointer.active=true;
    pointer.type=e.pointerType||pointer.type;
    pointer.lastMoveTime=now;

    if(pointer.type==="mouse"&&!pointer.down&&activePointers.size<2){
        applyCursorSweepImpulse(e.clientX,e.clientY,mdx,mdy,dt);
    }
    if(activePointers.size>=2){if(!pinch.active)beginPinch();updatePinch();tooltipFor(null);return}
    if(pointer.draggingNode&&pointer.id===e.pointerId){
        const dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;
        if(Math.abs(dx)+Math.abs(dy)>2)pointer.moved=true;

        const delta=screenDeltaToCloudLocal(dx,dy);

        pointer.draggingNode.sx+=delta.x;
        pointer.draggingNode.sy+=delta.y;
        pointer.draggingNode.sz+=delta.z;

        // 너무 멀리 튀어나가는 것만 제한하되, 완벽한 경계 형태는 만들지 않는다.
        pointer.draggingNode.sx=Math.max(-cloudExtentX*1.45,Math.min(cloudExtentX*1.45,pointer.draggingNode.sx));
        pointer.draggingNode.sy=Math.max(-cloudExtentY*1.45,Math.min(cloudExtentY*1.45,pointer.draggingNode.sy));
        pointer.draggingNode.sz=Math.max(-cloudExtentZ*1.45,Math.min(cloudExtentZ*1.45,pointer.draggingNode.sz));

        pointer.draggingNode.x=pointer.draggingNode.sx;
        pointer.draggingNode.y=pointer.draggingNode.sy;
        pointer.draggingNode.homeX=pointer.draggingNode.sx;
        pointer.draggingNode.homeY=pointer.draggingNode.sy;
        pointer.draggingNode.vx=0;
        pointer.draggingNode.vy=0;

        pointer.lastX=e.clientX;
        pointer.lastY=e.clientY;
        tooltipFor(null);
        return
    }
    if(pointer.down&&pointer.id===e.pointerId){const dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;if(Math.abs(dx)+Math.abs(dy)>2){pointer.moved=true;clearLongPress()}camera.x+=dx;camera.y+=dy;pointer.lastX=e.clientX;pointer.lastY=e.clientY;tooltipFor(null);return}
    hoveredNode=hitTest(e.clientX,e.clientY);tooltipFor(hoveredNode,e.clientX,e.clientY)
});
function finishPointer(e,cancelled=false){clearLongPress();const pinching=pinch.active;activePointers.delete(e.pointerId);if(pinching){if(activePointers.size<2)pinch.active=false;pointer.down=false;pointer.id=null;pointer.downNode=null;stopNodeDrag();return}const dragged=pointer.draggingNode,moved=pointer.moved;if(dragged){stopNodeDrag();if(!moved&&!cancelled)setSelected(dragged,false)}else if(pointer.down&&pointer.id===e.pointerId&&!moved&&!cancelled){const n=hitTest(e.clientX,e.clientY);n?setSelected(n,false):setSelected(null,false)}pointer.down=false;pointer.id=null;pointer.downNode=null;if(e.pointerType==="touch"){pointer.active=false;hoveredNode=null;tooltipFor(null)}}
canvas.addEventListener("pointerup",e=>finishPointer(e,false));
canvas.addEventListener("pointercancel",e=>finishPointer(e,true));
canvas.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!pointer.down){pointer.active=false;pointer.energy=0;pointer.speed=0;hoveredNode=null;tooltipFor(null)}});
canvas.addEventListener("dblclick",e=>{const n=hitTest(e.clientX,e.clientY);if(n)openLightbox(n)});
canvas.addEventListener("wheel",e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY),f=e.deltaY>0?.9:1.1;camera.zoom=Math.max(.28,Math.min(4.2,camera.zoom*f));const after=worldToScreen(before.x,before.y);camera.x+=e.clientX-after.x;camera.y+=e.clientY-after.y},{passive:false});

searchInput.oninput=e=>currentSearch=e.target.value.trim().toLowerCase();searchClear.onclick=()=>{currentSearch="";searchInput.value=""};fullscreenBtn.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
panelClose.onclick=()=>setSelected(null,false);
panelToggle.onclick=()=>{
    if(!window.matchMedia("(max-width:700px)").matches)return;

    const expanded=infoPanel.classList.toggle("expanded");
    panelToggle.textContent=expanded?"MINIMIZE":"DETAIL";
    document.body.classList.toggle("mobile-panel-expanded",expanded);
    document.body.classList.add("mobile-panel-open");
};
focusSelectedBtn.onclick=()=>{
    if(selectedNode)centerOnNode(selectedNode,1.65);
};
openSelectedBtn.onclick=()=>selectedNode&&openLightbox(selectedNode);
relatedList.onclick=e=>{
    const x=e.target.closest("[data-node]");
    if(!x)return;
    const n=nodes.find(n=>n.id===Number(x.dataset.node));
    if(n)setSelected(n,false)
};
function updateStats(){statCount.textContent=visibleNodes().length;statCopy.textContent=`photographs · ${edges.length} visible connections`}
function buildYears(){const years=[...new Set(photos.map(getYear).filter(Boolean))].sort();yearList.innerHTML=`<button class="year-btn active" data-year="all">ALL</button>`+years.map(y=>`<button class="year-btn" data-year="${y}">${y}</button>`).join("");yearList.onclick=e=>{const b=e.target.closest(".year-btn");if(!b)return;activeYear=b.dataset.year;document.querySelectorAll(".year-btn").forEach(x=>x.classList.toggle("active",x===b));activeYearLabel.textContent=activeYear==="all"?"ALL YEARS":activeYear;setSelected(null,false);buildEdges()}}
const currentVisibleOrdered=()=>visibleNodes();function openLightbox(n){const l=currentVisibleOrdered();lightboxIndex=l.indexOf(n);if(lightboxIndex<0)return;lightbox.classList.add("open");renderLightbox()}function renderLightbox(){const l=currentVisibleOrdered(),n=l[lightboxIndex];if(!n)return;const p=n.photo;lightboxImage.src=photoUrl(p.filename);lbNumber.textContent=`${String(lightboxIndex+1).padStart(2,"0")} / ${String(l.length).padStart(2,"0")}`;lbDate.textContent=formatDate(p.date)||"Undated";lbMeta.innerHTML=[getLocation(p),getCamera(p),normalizeColor(p.color)].filter(Boolean).map(escapeHtml).join("<br>")}function moveLightbox(d){const l=currentVisibleOrdered();if(!l.length)return;lightboxIndex=(lightboxIndex+d+l.length)%l.length;renderLightbox()}lightboxClose.onclick=()=>lightbox.classList.remove("open");lbPrev.onclick=()=>moveLightbox(-1);lbNext.onclick=()=>moveLightbox(1);document.addEventListener("keydown",e=>{if(lightbox.classList.contains("open")){if(e.key==="Escape")lightbox.classList.remove("open");if(e.key==="ArrowLeft")moveLightbox(-1);if(e.key==="ArrowRight")moveLightbox(1);return}if(e.key==="Escape")setSelected(null,false)});

async function loadJson(file,fallback){try{const r=await fetch(`${file}?v=${Date.now()}`,{cache:"no-store"});return r.ok?await r.json():fallback}catch{return fallback}}
async function init(){resize();const site=await loadJson("site.json",{});brandMark.textContent=site.brandMark||"h.";brandName.textContent=site.brandName||"hamihamoo";brandSubtitle.textContent=site.brandSubtitle||"PHOTOGRAPHY";graphTitle.textContent=`PHOTO ${String(site.graphLabel||"Graph").toUpperCase()}`;const [pd,pr]=await Promise.all([loadJson("photos.json",[]),loadJson("projects.json",[])]);photos=Array.isArray(pd)?pd:[];projects=Array.isArray(pr)?pr:[];buildProjectMaps();buildNodes();buildYears();buildEdges();camera={x:width/2,y:height/2,zoom:1};loading.classList.add("hide");loop()}
init();
</script>
</body>
