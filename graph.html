<head>

<style>
:root{--bg:#101417;--panel:#151b1f;--text:#f2f3ef;--muted:#7f8990;--line:#2a3238;--accent:#61e38e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}

.header{position:absolute;z-index:30;top:0;left:0;right:0;height:74px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(12,16,19,.82);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px}.mark{width:32px;height:35px;display:grid;place-items:center;border:1px solid #b9c0c3;font:italic 25px/1 Georgia,serif}.brand strong{font-size:14px}.brand small{display:block;margin-top:4px;color:#909a9f;font-size:8px;letter-spacing:.16em}.brand-title{margin-left:18px;padding-left:18px;border-left:1px solid rgba(255,255,255,.12);color:#aab2b6;font-size:9px;letter-spacing:.17em}
.actions,.mode-switch,.layer-bar,.year-list{display:flex;align-items:center}.actions{gap:8px}.btn,.mode-btn,.layer-btn,.year-btn{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.035);color:#b9c1c5}.btn:hover,.mode-btn:hover,.layer-btn:hover,.year-btn:hover{color:#fff;border-color:rgba(255,255,255,.32)}.btn{height:34px;padding:0 12px;font-size:9px}.btn.accent{color:#8aefa9;border-color:rgba(97,227,142,.34)}
.top-controls{position:absolute;z-index:22;top:90px;left:26px;display:block}.simple-search{display:block}.mode-switch{background:rgba(15,19,22,.8);backdrop-filter:blur(12px)}.mode-btn{border:0;border-right:1px solid rgba(255,255,255,.08);padding:9px 13px;font-size:9px;letter-spacing:.1em}.mode-btn:last-child{border-right:0}.mode-btn.active{background:rgba(255,255,255,.11);color:#fff}
.search{position:relative}.search input{width:220px;height:34px;padding:0 32px 0 11px;border:1px solid rgba(255,255,255,.12);outline:0;background:rgba(15,19,22,.82);color:#fff;font-size:10px}.search input::placeholder{color:#667178}.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#748087;font-size:15px}
.stats{position:absolute;z-index:20;right:26px;top:93px;text-align:right;pointer-events:none}.stats strong{display:block;font:400 28px/1 Georgia,serif}.stats span{display:block;margin-top:5px;color:#637078;font-size:8px;letter-spacing:.11em;text-transform:uppercase}
.legend{position:absolute;z-index:20;left:26px;top:145px;padding-left:10px;border-left:1px solid rgba(255,255,255,.13);color:#59656c;font-size:8px;line-height:1.8}.legend b{color:#89949a;font-weight:400}
.timeline{position:absolute;z-index:22;left:26px;bottom:25px;width:275px;padding:10px 12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,19,22,.82);backdrop-filter:blur(13px)}.timeline-head{display:flex;justify-content:space-between;margin-bottom:7px;color:#68747b;font-size:8px;letter-spacing:.12em}.year-list{gap:4px;overflow:auto;scrollbar-width:none}.year-btn{flex:0 0 auto;border-color:transparent;padding:5px 7px;background:transparent;font-size:9px}.year-btn.active{color:#fff;border-color:rgba(255,255,255,.2)}
.layer-bar{position:absolute;z-index:22;left:50%;bottom:24px;transform:translateX(-50%);gap:5px;padding:6px;border:1px solid rgba(255,255,255,.1);background:rgba(15,19,22,.82);backdrop-filter:blur(13px)}.layer-btn{border-color:transparent;padding:8px 10px;background:transparent;font-size:8px;letter-spacing:.11em}.layer-btn.active{color:#8ff2ae;border-color:rgba(97,227,142,.28);background:rgba(97,227,142,.06)}
.panel{position:absolute;z-index:28;top:74px;right:0;bottom:0;width:360px;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);border-left:1px solid rgba(255,255,255,.09);background:rgba(15,19,22,.96);backdrop-filter:blur(18px);overflow:auto}.panel.open{transform:translateX(0)}.panel-head{position:sticky;top:0;z-index:2;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(15,19,22,.95)}.panel-head span{color:#6f7a80;font-size:8px;letter-spacing:.16em}.panel-head button{border:0;background:none;color:#9aa4aa;font-size:20px}.panel-image{width:100%;max-height:320px;object-fit:cover;background:#222}.panel-body{padding:20px}.panel-no{color:#657178;font-size:8px}.panel-date{margin-top:8px;font:400 28px/1 Georgia,serif}.panel-location{margin-top:8px;color:#aab2b6;font-size:11px;line-height:1.6}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.chip{padding:5px 7px;border:1px solid rgba(255,255,255,.12);color:#aab3b7;font-size:8px}.meta{margin-top:20px;border-top:1px solid rgba(255,255,255,.1)}.meta-row{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}.meta-row b{color:#647078;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:400}.meta-row span{color:#c9d0d3;font-size:10px;line-height:1.5}.related-title{margin:23px 0 10px;color:#6f7a80;font-size:8px;letter-spacing:.13em}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.related div{aspect-ratio:1/1;overflow:hidden;background:#222;cursor:pointer}.related img{width:100%;height:100%;object-fit:cover;opacity:.86}.related div:hover img{opacity:1}.panel-actions{display:flex;gap:7px;margin-top:18px}.panel-actions button{flex:1;padding:9px;border:1px solid rgba(255,255,255,.13);background:transparent;color:#c1c8cb;font-size:9px}
.tooltip{position:absolute;z-index:40;width:170px;display:none;pointer-events:none;border:1px solid rgba(255,255,255,.13);background:rgba(14,18,21,.96);box-shadow:0 16px 38px rgba(0,0,0,.34)}.tooltip.show{display:block}.tooltip img{width:100%;height:112px;object-fit:cover}.tooltip-body{padding:9px 10px}.tooltip-date{font:400 15px/1.2 Georgia,serif}.tooltip-copy{margin-top:5px;color:#7f8b91;font-size:8px;line-height:1.5}
.loading{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);transition:.35s}.loading.hide{opacity:0;visibility:hidden}.loading-box{text-align:center}.loading-mark{width:42px;height:46px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid #879096;font:italic 34px/1 Georgia,serif}.loading-text{color:#879096;font-size:9px;letter-spacing:.18em}
.lightbox{position:fixed;inset:0;z-index:100;display:none;background:rgba(5,7,8,.97)}.lightbox.open{display:flex}.lightbox-close{position:absolute;top:17px;right:22px;z-index:2;border:0;background:none;color:#fff;font-size:28px}.lb-grid{width:100%;height:100%;display:grid;grid-template-columns:1fr 290px}.lb-stage{position:relative;display:grid;place-items:center;padding:30px}.lb-image{max-width:100%;max-height:90vh;object-fit:contain}.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(0,0,0,.28);color:#fff;font-size:25px}.lb-prev{left:18px}.lb-next{right:18px}.lb-info{padding:80px 22px 30px;border-left:1px solid rgba(255,255,255,.08);overflow:auto}.lb-no{color:#677279;font-size:9px}.lb-date{margin-top:10px;font:400 32px/1 Georgia,serif}.lb-meta{margin-top:25px;color:#88949a;font-size:10px;line-height:1.8}
@media(max-width:900px){.brand-title{display:none}.desktop-only{display:none}.search input{width:175px}.timeline{width:225px}.layer-bar{left:auto;right:16px;transform:none;max-width:calc(100% - 260px);overflow:auto}.panel{width:330px}}
@media(max-width:700px){.header{height:64px;padding:0 14px}.mark{width:29px;height:32px;font-size:23px}.brand strong{font-size:12px}.brand small{font-size:7px}.btn{height:31px;padding:0 8px}.top-controls{top:77px;left:12px;right:12px;display:block}.search input{width:100%}.legend{display:none}.stats{top:127px;right:14px}.stats strong{font-size:21px}.timeline{left:12px;right:12px;bottom:12px;width:auto}.layer-bar{left:12px;right:12px;bottom:12px;transform:none;max-width:none;overflow:auto;justify-content:flex-start}.panel{top:auto;left:0;right:0;bottom:0;width:100%;height:min(72vh,640px);transform:translateY(102%);border-left:0;border-top:1px solid rgba(255,255,255,.1)}.panel.open{transform:translateY(0)}.panel-image{max-height:240px}.lb-grid{display:block}.lb-stage{height:100%}.lb-info{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;border:0;background:linear-gradient(to top,rgba(5,7,8,.96),rgba(5,7,8,.6),transparent)}.lb-date{font-size:22px}.lb-meta{margin-top:7px;font-size:9px}}
</style>

<body>
<div class="app">
<canvas id="graphCanvas"></canvas>

<header class="header">
    <a class="brand" href="index.html">
        <div class="mark" id="brandMark">h.</div>
        <div><strong id="brandName">hamihamoo</strong><small id="brandSubtitle">PHOTOGRAPHY</small></div>
        <div class="brand-title">PHOTO GRAPH</div>
    </a>
    <div class="actions">
        <button class="btn accent" id="journeyBtn">▶ JOURNEY</button>

    </div>
</header>

<div class="top-controls simple-search">
    <div class="search">

    </div>
</div>

<div class="legend"><b>IDLE</b> SLOW ROTATION<br><b>SWEEP CURSOR</b> DISTURB<br><b>SCROLL</b> ZOOM<br><b>DRAG NODE</b> MOVE<br><b>DRAG SPACE</b> PAN<br><b>CLICK</b> FOCUS</div>
<div class="stats"><strong id="statCount">0</strong><span id="statCopy">photographs · 0 connections</span></div>

<div class="timeline">
    <div class="timeline-head"><span>TIME FIELD</span><span id="activeYearLabel">ALL YEARS</span></div>
    <div class="year-list" id="yearList"></div>
</div>



<aside class="panel" id="infoPanel">
    <div class="panel-head"><span>SELECTED PHOTOGRAPH</span><button id="panelClose">×</button></div>
    <img class="panel-image" id="panelImage" alt="">
    <div class="panel-body">
        <div class="panel-no" id="panelNumber"></div>

            <div class="meta-row"><b>Camera</b><span id="panelCamera">-</span></div>

    <img id="tooltipImage" alt="">
    <div class="tooltip-body"><div class="tooltip-date" id="tooltipDate"></div><div class="tooltip-copy" id="tooltipCopy"></div></div>
</div>

<div class="loading" id="loading"><div class="loading-box"><div class="loading-mark">h.</div><div class="loading-text">BUILDING PHOTO GRAPH...</div></div></div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <div class="lb-grid">
        <div class="lb-stage">
            <button class="lb-prev" id="lbPrev">‹</button>
            <img class="lb-image" id="lightboxImage" alt="">
            <button class="lb-next" id="lbNext">›</button>
        </div>
        <div class="lb-info"><div class="lb-no" id="lbNumber"></div><div class="lb-date" id="lbDate"></div><div class="lb-meta" id="lbMeta"></div></div>
    </div>
</div>
</div>

<script>
const canvas=document.getElementById("graphCanvas"),ctx=canvas.getContext("2d");
let photos=[],projects=[],nodes=[],edges=[],allRelations=[],projectMap=new Map(),photoProjectMap=new Map();
let activeYear="all",selectedNode=null,hoveredNode=null,currentSearch="";
let orbitMap=new Map();
let ambientRotationEnabled=true;
let width=innerWidth,height=innerHeight,dpr=Math.max(1,Math.min(2,devicePixelRatio||1)),simulationTicks=0;
let camera={x:width/2,y:height/2,zoom:1};
let pointer={down:false,moved:false,lastX:0,lastY:0,x:0,y:0,active:false,id:null,type:"mouse",downNode:null,draggingNode:null,longPressTimer:null,moveX:0,moveY:0,lastMoveTime:0,speed:0,energy:0};
const activePointers=new Map();
let pinch={active:false,startDistance:0,startZoom:1,worldX:0,worldY:0};
let journeyTimer=null,journeyRunning=false,lightboxIndex=-1;

const safe=v=>String(v??"");
const photoUrl=f=>"images/digital/"+encodeURIComponent(f);
const formatDate=v=>safe(v).replace(/-/g,".");
const getYear=p=>(safe(p.date).match(/^(\d{4})/)||[])[1]||"";
const getLocation=p=>{const l=p.location||{};return l.displayName||[l.region,l.city,l.district,l.country].filter(Boolean).join(" ")||""};
const getLatLng=p=>{const l=p.location||{},lat=Number(l.latitude),lng=Number(l.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null};
const getCamera=p=>{const t=safe(p.info).trim(),m=t.match(/\bf\d+(\.\d+)?\b/i);return m?(t.slice(0,m.index).trim()||t):(t||"-")};
const normalizeColor=v=>{const x=safe(v).trim();if(/^#[0-9a-f]{6}$/i.test(x))return x;if(/^#[0-9a-f]{3}$/i.test(x))return "#"+x.slice(1).split("").map(c=>c+c).join("");const n={red:"#b65a52",orange:"#c77d42",yellow:"#c8b653",green:"#5f8d67",blue:"#5c7899",purple:"#7b668d",pink:"#b87c8d",brown:"#7f6754",black:"#3d4143",white:"#d9d9d3",gray:"#858b8e",grey:"#858b8e"};return n[x.toLowerCase()]||"#9aa3a8"};
const hexToRgb=h=>{h=normalizeColor(h).slice(1);return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}};
const colorDistance=(a,b)=>{const x=hexToRgb(a),y=hexToRgb(b);return Math.hypot(x.r-y.r,x.g-y.g,x.b-y.b)};
const projectIdsFor=f=>photoProjectMap.get(f)||[];
const sameProject=(a,b)=>{const s=new Set(projectIdsFor(a.filename));return projectIdsFor(b.filename).some(id=>s.has(id))};
const samePlace=(a,b)=>{const x=getLocation(a),y=getLocation(b);return x&&y&&x===y};
function dateScore(a,b){const x=safe(a.date),y=safe(b.date);if(!x||!y)return 0;if(x===y)return 5;if(x.slice(0,7)===y.slice(0,7))return 2.2;if(x.slice(0,4)===y.slice(0,4))return .6;return 0}
function relation(a,b,L="all"){const d=dateScore(a,b),p=samePlace(a,b)?5:0,j=sameProject(a,b)?6:0,cd=colorDistance(a.color,b.color),c=cd<55?3.2:cd<90?1.8:cd<125?.7:0,e=getCamera(a)===getCamera(b)?1.5:0;let w=0;if(L==="all")w=d+p+j+c+e;if(L==="date")w=d;if(L==="place")w=p;if(L==="project")w=j;if(L==="color")w=c;if(L==="exif")w=e;return{weight:w,date:d,place:p,project:j,color:c,exif:e}}
const visibleNodes=()=>nodes.filter(n=>activeYear==="all"||getYear(n.photo)===activeYear);
function searchMatch(n){if(!currentSearch)return true;const p=n.photo,pt=projectIdsFor(p.filename).map(id=>projectMap.get(id)?.title||"").join(" ");return[p.filename,p.date,p.info,p.color,getLocation(p),pt].filter(Boolean).join(" ").toLowerCase().includes(currentSearch)}

function buildProjectMaps(){projectMap.clear();photoProjectMap.clear();projects.forEach(p=>{projectMap.set(p.id,p);(p.photos||[]).forEach(f=>{if(!photoProjectMap.has(f))photoProjectMap.set(f,[]);photoProjectMap.get(f).push(p.id)})})}
function buildNodes(){
    const total=Math.max(1,photos.length);
    const golden=2.399963229728653;

    nodes=photos.map((photo,id)=>{
        const t=(id+.5)/total;
        const angle=id*golden+(Math.random()-.5)*.16;
        const radius=95+Math.sqrt(t)*470;
        const x=Math.cos(angle)*radius;
        const y=Math.sin(angle)*radius*.82;

        return{id,photo,x,y,homeX:x,homeY:y,vx:0,vy:0,ox:0,oy:0,ovx:0,ovy:0,orbitMix:0};
    });
}
function buildEdges(){
    const v=visibleNodes(),c=[];

    for(let i=0;i<v.length;i++){
        for(let j=i+1;j<v.length;j++){
            const rel=relation(v[i].photo,v[j].photo,"all");
            if(rel.weight>0){
                c.push({a:v[i],b:v[j],...rel});
            }
        }
    }

    c.sort((a,b)=>b.weight-a.weight);
    allRelations=c;
    edges=[];

    const degree=new Map();
    const maxEdges=Math.min(115,Math.max(55,Math.floor(v.length*.60)));

    function tryAdd(edge,minWeight){
        if(edges.length>=maxEdges)return false;
        if(edge.weight<minWeight)return false;

        const da=degree.get(edge.a.id)||0;
        const db=degree.get(edge.b.id)||0;
        if(da>=2||db>=2)return false;

        // 매우 긴 선은 정말 강한 관계일 때만 남긴다.
        const dist=Math.hypot(edge.b.x-edge.a.x,edge.b.y-edge.a.y);
        if(dist>360&&edge.weight<6)return false;

        edges.push(edge);
        degree.set(edge.a.id,da+1);
        degree.set(edge.b.id,db+1);
        return true;
    }

    // 먼저 강한 관계만.
    for(const edge of c){
        tryAdd(edge,4.4);
        if(edges.length>=maxEdges)break;
    }

    // 너무 비어 보이는 경우에만 중간 강도의 관계를 약간 보충.
    const minimum=Math.min(78,Math.floor(v.length*.42));
    if(edges.length<minimum){
        for(const edge of c){
            if(edges.includes(edge))continue;
            tryAdd(edge,3.15);
            if(edges.length>=minimum)break;
        }
    }

    refreshOrbitTargets();
    simulationTicks=0;
    updateStats();
}

function resize(){width=innerWidth;height=innerHeight;dpr=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+"px";canvas.style.height=height+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener("resize",resize);
const worldToScreen=(x,y)=>({x:x*camera.zoom+camera.x,y:y*camera.zoom+camera.y});
const screenToWorld=(x,y)=>({x:(x-camera.x)/camera.zoom,y:(y-camera.y)/camera.zoom});
function animateCamera(target,d=500){const s={...camera},t0=performance.now();function f(now){const t=Math.min(1,(now-t0)/d),e=1-Math.pow(1-t,3);camera.x=s.x+(target.x-s.x)*e;camera.y=s.y+(target.y-s.y)*e;camera.zoom=s.zoom+(target.zoom-s.zoom)*e;if(t<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function resetCamera(){animateCamera({x:width/2,y:height/2,zoom:1})}
function centerOnNode(n,z=Math.max(camera.zoom,1.35)){animateCamera({x:width/2-n.x*z,y:height/2-n.y*z,zoom:z},600)}



function applyCursorSweepImpulse(x,y,dx,dy,dt){
    if(pointer.type!=="mouse"||pointer.down||pinch.active)return;

    const speed=Math.hypot(dx,dy)/Math.max(8,dt);
    pointer.speed=speed;
    if(speed<0.30)return;

    const radius=205;
    const speedPower=Math.min(1.25,(speed-.30)/1.20);
    if(speedPower<=0)return;

    pointer.energy=Math.max(pointer.energy,Math.min(1,speedPower));

    visibleNodes().forEach(n=>{
        if(n===pointer.draggingNode)return;

        const p=screenPosition(n);
        let tx=x-p.x,ty=y-p.y;
        const dist=Math.hypot(tx,ty);
        if(!dist||dist>=radius)return;

        const falloff=Math.pow(1-dist/radius,2);
        tx/=dist;ty/=dist;

        const impulse=(2.15*speedPower*falloff)/Math.max(.55,camera.zoom);
        n.ovx=(n.ovx||0)+tx*impulse;
        n.ovy=(n.ovy||0)+ty*impulse;
    });
}

function strongestConnections(n){
    if(!n)return[];
    return allRelations
        .filter(e=>e.a===n||e.b===n)
        .map(e=>({
            node:e.a===n?e.b:e.a,
            weight:e.weight,
            edge:e
        }))
        .sort((a,b)=>b.weight-a.weight);
}

function refreshOrbitTargets(){
    orbitMap.clear();
    if(!selectedNode)return;

    strongestConnections(selectedNode)
        .filter(item=>visibleNodes().includes(item.node))
        .slice(0,6)
        .forEach((item,index)=>orbitMap.set(item.node.id,index));
}

function visualWorld(n,now=performance.now()){
    let x=n.x+(n.ox||0);
    let y=n.y+(n.oy||0);

    const idx=orbitMap.get(n.id);
    const shouldOrbit=selectedNode&&idx!==undefined&&n!==selectedNode;
    const target=shouldOrbit?1:0;

    n.orbitMix+=(target-n.orbitMix)*.10;

    if(n.orbitMix>.001&&selectedNode&&n!==selectedNode){
        const ring=idx<4?92:137;
        const localIndex=idx<4?idx:idx-4;
        const groupCount=idx<4
            ? Math.min(4,orbitMap.size)
            : Math.max(1,orbitMap.size-4);

        const direction=idx%2===0?1:-1;
        const angle=(localIndex/Math.max(1,groupCount))*Math.PI*2 + now*.00018*direction;

        const cx=selectedNode.x+(selectedNode.ox||0);
        const cy=selectedNode.y+(selectedNode.oy||0);
        const tx=cx+Math.cos(angle)*ring;
        const ty=cy+Math.sin(angle)*ring;

        x+=(tx-x)*n.orbitMix;
        y+=(ty-y)*n.orbitMix;
    }

    return{x,y};
}

function screenPosition(n,now=performance.now()){
    const w=visualWorld(n,now);
    return worldToScreen(w.x,w.y);
}

function updateCursorOffsets(){
    const spring=.21;
    const damping=.70;
    const maxScreenOffset=32;

    nodes.forEach(n=>{
        if(n===pointer.draggingNode){
            n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;
            return;
        }

        n.ovx=(n.ovx||0)-(n.ox||0)*spring;
        n.ovy=(n.ovy||0)-(n.oy||0)*spring;
        n.ovx*=damping;
        n.ovy*=damping;
        n.ox=(n.ox||0)+n.ovx;
        n.oy=(n.oy||0)+n.ovy;

        const maxWorld=maxScreenOffset/Math.max(.45,camera.zoom);
        const d=Math.hypot(n.ox,n.oy);
        if(d>maxWorld){
            n.ox=n.ox/d*maxWorld;
            n.oy=n.oy/d*maxWorld;
        }

        if(Math.abs(n.ox)<.002&&Math.abs(n.oy)<.002&&Math.abs(n.ovx)<.002&&Math.abs(n.ovy)<.002){
            n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;
        }
    });

    pointer.energy*=.84;
    if(pointer.energy<.01)pointer.energy=0;
}


function applyAmbientRotation(){
    if(!ambientRotationEnabled)return;

    // 아주 느린 자동 회전: 약 15~16분에 한 바퀴.
    const angle=.00011;
    const cos=Math.cos(angle);
    const sin=Math.sin(angle);

    nodes.forEach(n=>{
        if(n===pointer.draggingNode)return;

        const x=n.x,y=n.y;
        n.x=x*cos-y*sin;
        n.y=x*sin+y*cos;

        const hx=n.homeX,hy=n.homeY;
        n.homeX=hx*cos-hy*sin;
        n.homeY=hx*sin+hy*cos;
    });
}

function simulate(){
    const v=visibleNodes();
    if(!v.length)return;

    applyAmbientRotation();
    updateCursorOffsets();
    simulationTicks++;
    const settling=simulationTicks<300;

    // 중앙으로 모으는 힘은 전혀 사용하지 않는다.
    // 각 노드는 자신의 최초/드롭 위치(home)만 기준으로 안정된다.
    v.forEach(n=>{
        if(n===pointer.draggingNode)return;
        n.vx+=(n.homeX-n.x)*.0042;
        n.vy+=(n.homeY-n.y)*.0042;
    });

    if(settling){
        for(let i=0;i<v.length;i++){
            for(let j=i+1;j<v.length;j++){
                const A=v[i],B=v[j];
                if(A===pointer.draggingNode||B===pointer.draggingNode)continue;
                let dx=B.x-A.x,dy=B.y-A.y;
                const d2=dx*dx+dy*dy+.1;
                if(d2>28000)continue;
                const dist=Math.sqrt(d2),force=760/d2;
                dx/=dist;dy/=dist;
                A.vx-=dx*force;A.vy-=dy*force;
                B.vx+=dx*force;B.vy+=dy*force;
            }
        }

        // 관계선은 아주 약한 미세 조정만 한다.
        edges.forEach(e=>{
            let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y;
            const dist=Math.hypot(dx,dy)||1;
            const force=(dist-155)*.000055*Math.min(3,e.weight);
            dx/=dist;dy/=dist;
            if(e.a!==pointer.draggingNode){e.a.vx+=dx*force;e.a.vy+=dy*force}
            if(e.b!==pointer.draggingNode){e.b.vx-=dx*force;e.b.vy-=dy*force}
        });
    }

    v.forEach(n=>{
        if(n===pointer.draggingNode)return;
        n.vx*=.78;n.vy*=.78;
        n.x+=n.vx;n.y+=n.vy;
    });
}
function drawPointerField(){
    if(pointer.energy<=0||pointer.type!=="mouse"||pointer.down||pinch.active)return;

    const r=72+pointer.energy*46;
    const a=.014+.038*pointer.energy;
    const g=ctx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,r);
    g.addColorStop(0,`rgba(97,227,142,${a})`);
    g.addColorStop(.55,`rgba(97,227,142,${a*.32})`);
    g.addColorStop(1,"rgba(97,227,142,0)");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(pointer.x,pointer.y,r,0,Math.PI*2);
    ctx.fill();
}
function drawBackground(){ctx.clearRect(0,0,width,height)}
function drawNebula(){if(camera.zoom<.55)return;visibleNodes().forEach((n,i)=>{if(i%3)return;const p=worldToScreen(n.x,n.y),rgb=hexToRgb(n.photo.color),r=38*camera.zoom,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(${rgb.r},${rgb.g},${rgb.b},.045)`);g.addColorStop(1,`rgba(${rgb.r},${rgb.g},${rgb.b},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill()})}
function drawEdges(){
    const visibleSet=new Set(visibleNodes().map(n=>n.id));

    edges.forEach(e=>{
        if(!visibleSet.has(e.a.id)||!visibleSet.has(e.b.id))return;

        const a=screenPosition(e.a);
        const b=screenPosition(e.b);

        const touchesSelected=selectedNode&&(e.a===selectedNode||e.b===selectedNode);
        let alpha=Math.min(.105,.022+e.weight*.009);

        if(selectedNode&&!touchesSelected)alpha*=.22;
        if(touchesSelected)alpha=.20;

        ctx.strokeStyle=`rgba(177,190,196,${alpha})`;
        ctx.lineWidth=.6;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
    });

    if(!selectedNode)return;

    // 선택된 사진의 핵심 관계만 별도로 선명하게 표시.
    strongestConnections(selectedNode).slice(0,6).forEach((item,index)=>{
        const a=screenPosition(selectedNode);
        const b=screenPosition(item.node);
        const alpha=.56-index*.045;

        ctx.strokeStyle=`rgba(105,231,145,${Math.max(.30,alpha)})`;
        ctx.lineWidth=1.05;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
    });
}

function drawNodes(){
    const now=performance.now();

    visibleNodes().forEach((n,i)=>{
        const p=screenPosition(n,now);
        if(p.x<-40||p.x>width+40||p.y<50||p.y>height+40)return;

        const match=searchMatch(n);
        const sel=selectedNode===n;
        const hover=hoveredNode===n;
        const orbiting=orbitMap.has(n.id);

        let alpha=match?.92:.12;

        if(selectedNode&&!sel){
            alpha*=orbiting?.95:.26;
        }

        const rgb=hexToRgb(n.photo.color);
        const r=(sel?7.6:hover?5.7:orbiting?4.3:3.15)*Math.max(.78,Math.min(1.5,camera.zoom));

        if(sel||hover||orbiting){
            ctx.fillStyle=sel
                ?"rgba(97,227,142,.15)"
                :`rgba(${rgb.r},${rgb.g},${rgb.b},${orbiting?.10:.07})`;

            ctx.beginPath();
            ctx.arc(p.x,p.y,r*(sel?3.4:2.6),0,Math.PI*2);
            ctx.fill();
        }

        ctx.fillStyle=sel
            ?"rgba(97,227,142,1)"
            :orbiting
                ?`rgba(${rgb.r},${rgb.g},${rgb.b},.98)`
                :`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;

        ctx.beginPath();
        ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fill();

        if(i%6===0&&camera.zoom>1.55&&match&&!selectedNode){
            ctx.fillStyle="rgba(255,255,255,.28)";
            ctx.font="7px Arial";
            ctx.fillText(formatDate(n.photo.date),p.x+7,p.y+3);
        }
    });
}

function loop(){simulate();drawBackground();drawNebula();drawEdges();drawPointerField();drawNodes();requestAnimationFrame(loop)}
function hitTest(x,y){
    let best=null,bd=Infinity;

    for(const n of visibleNodes()){
        const p=screenPosition(n);
        const d=Math.hypot(x-p.x,y-p.y);
        const orbiting=orbitMap.has(n.id);
        const limit=Math.max(orbiting?13:10,(orbiting?9:7)*camera.zoom);

        if(d<limit&&d<bd){
            best=n;
            bd=d;
        }
    }

    return best;
}

function tooltipFor(n,x,y){const t=document.getElementById("tooltip");if(!n){t.classList.remove("show");return}document.getElementById("tooltipImage").src=photoUrl(n.photo.filename);document.getElementById("tooltipDate").textContent=formatDate(n.photo.date)||"Undated";document.getElementById("tooltipCopy").textContent=[getLocation(n.photo),getCamera(n.photo)].filter(Boolean).join(" · ");t.style.left=Math.min(width-184,x+14)+"px";t.style.top=Math.min(height-160,y+14)+"px";t.classList.add("show")}
function setSelected(n,center=true){
    selectedNode=n;
    refreshOrbitTargets();

    if(!n){
        document.getElementById("infoPanel").classList.remove("open");
        return;
    }

    if(center)centerOnNode(n);

    const p=n.photo;
    const ids=projectIdsFor(p.filename);
    const rel=strongestConnections(n);

    panelImage.src=photoUrl(p.filename);
    panelNumber.textContent=`PHOTO ${String(n.id+1).padStart(3,"0")}`;
    panelDate.textContent=formatDate(p.date)||"Undated";
    panelLocation.textContent=getLocation(p)||"Location unavailable";
    panelCamera.textContent=getCamera(p);
    panelColor.textContent=normalizeColor(p.color);
    panelConnections.textContent=`${Math.min(6,rel.length)} orbit connections`;

    panelProjects.innerHTML=ids
        .map(id=>`<span class="chip">${escapeHtml(projectMap.get(id)?.title||"Project")}</span>`)
        .join("");

    relatedList.innerHTML=rel.slice(0,6)
        .map(x=>`<div data-node="${x.node.id}"><img src="${photoUrl(x.node.photo.filename)}" alt=""></div>`)
        .join("");

    infoPanel.classList.add("open");
}

function escapeHtml(v){return safe(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function clearLongPress(){if(pointer.longPressTimer){clearTimeout(pointer.longPressTimer);pointer.longPressTimer=null}}
function startNodeDrag(n){if(!n)return;pointer.draggingNode=n;n.vx=0;n.vy=0;n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;n.orbitMix=0;simulationTicks=0;canvas.classList.add("dragging")}
function stopNodeDrag(){if(pointer.draggingNode){pointer.draggingNode.vx=0;pointer.draggingNode.vy=0;pointer.draggingNode.homeX=pointer.draggingNode.x;pointer.draggingNode.homeY=pointer.draggingNode.y;pointer.draggingNode=null;simulationTicks=300}canvas.classList.remove("dragging")}
function beginPinch(){if(activePointers.size<2)return;const pts=[...activePointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,w=screenToWorld(cx,cy);pinch={active:true,startDistance:Math.max(1,Math.hypot(dx,dy)),startZoom:camera.zoom,worldX:w.x,worldY:w.y};clearLongPress();stopNodeDrag();pointer.moved=true}
function updatePinch(){if(!pinch.active||activePointers.size<2)return;const pts=[...activePointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,dist=Math.max(1,Math.hypot(dx,dy)),z=Math.max(.28,Math.min(4.2,pinch.startZoom*(dist/pinch.startDistance)));camera.zoom=z;camera.x=cx-pinch.worldX*z;camera.y=cy-pinch.worldY*z}
canvas.addEventListener("pointerdown",e=>{
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});canvas.setPointerCapture(e.pointerId);
    pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;pointer.type=e.pointerType||"mouse";
    if(activePointers.size===2){beginPinch();return}
    pointer.down=true;pointer.id=e.pointerId;pointer.moved=false;pointer.lastX=e.clientX;pointer.lastY=e.clientY;pointer.downNode=hitTest(e.clientX,e.clientY);
    if(pointer.type==="mouse"&&pointer.downNode)startNodeDrag(pointer.downNode);
    else if(pointer.type==="touch"&&pointer.downNode){clearLongPress();pointer.longPressTimer=setTimeout(()=>{if(pointer.down&&!pointer.moved&&activePointers.size===1){startNodeDrag(pointer.downNode);if(navigator.vibrate)navigator.vibrate(12)}},280)}
});
canvas.addEventListener("pointermove",e=>{
    if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});

    const now=performance.now();
    const prevX=pointer.x,prevY=pointer.y;
    const dt=pointer.lastMoveTime?now-pointer.lastMoveTime:16;
    const mdx=e.clientX-prevX,mdy=e.clientY-prevY;

    pointer.x=e.clientX;
    pointer.y=e.clientY;
    pointer.active=true;
    pointer.type=e.pointerType||pointer.type;
    pointer.lastMoveTime=now;

    if(pointer.type==="mouse"&&!pointer.down&&activePointers.size<2){
        applyCursorSweepImpulse(e.clientX,e.clientY,mdx,mdy,dt);
    }
    if(activePointers.size>=2){if(!pinch.active)beginPinch();updatePinch();tooltipFor(null);return}
    if(pointer.draggingNode&&pointer.id===e.pointerId){const dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;if(Math.abs(dx)+Math.abs(dy)>2)pointer.moved=true;const w=screenToWorld(e.clientX,e.clientY);pointer.draggingNode.x=w.x;pointer.draggingNode.y=w.y;pointer.draggingNode.vx=0;pointer.draggingNode.vy=0;pointer.lastX=e.clientX;pointer.lastY=e.clientY;tooltipFor(null);return}
    if(pointer.down&&pointer.id===e.pointerId){const dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;if(Math.abs(dx)+Math.abs(dy)>2){pointer.moved=true;clearLongPress()}camera.x+=dx;camera.y+=dy;pointer.lastX=e.clientX;pointer.lastY=e.clientY;tooltipFor(null);return}
    hoveredNode=hitTest(e.clientX,e.clientY);tooltipFor(hoveredNode,e.clientX,e.clientY)
});
function finishPointer(e,cancelled=false){clearLongPress();const pinching=pinch.active;activePointers.delete(e.pointerId);if(pinching){if(activePointers.size<2)pinch.active=false;pointer.down=false;pointer.id=null;pointer.downNode=null;stopNodeDrag();return}const dragged=pointer.draggingNode,moved=pointer.moved;if(dragged){stopNodeDrag();if(!moved&&!cancelled)setSelected(dragged,true)}else if(pointer.down&&pointer.id===e.pointerId&&!moved&&!cancelled){const n=hitTest(e.clientX,e.clientY);n?setSelected(n,true):setSelected(null,false)}pointer.down=false;pointer.id=null;pointer.downNode=null;if(e.pointerType==="touch"){pointer.active=false;hoveredNode=null;tooltipFor(null)}}
canvas.addEventListener("pointerup",e=>finishPointer(e,false));
canvas.addEventListener("pointercancel",e=>finishPointer(e,true));
canvas.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!pointer.down){pointer.active=false;pointer.energy=0;pointer.speed=0;hoveredNode=null;tooltipFor(null)}});
canvas.addEventListener("dblclick",e=>{const n=hitTest(e.clientX,e.clientY);if(n)openLightbox(n)});
canvas.addEventListener("wheel",e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY),f=e.deltaY>0?.9:1.1;camera.zoom=Math.max(.28,Math.min(4.2,camera.zoom*f));const after=worldToScreen(before.x,before.y);camera.x+=e.clientX-after.x;camera.y+=e.clientY-after.y},{passive:false});

searchInput.oninput=e=>currentSearch=e.target.value.trim().toLowerCase();searchClear.onclick=()=>{currentSearch="";searchInput.value=""};fullscreenBtn.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
panelClose.onclick=()=>setSelected(null,false);focusSelectedBtn.onclick=()=>selectedNode&&centerOnNode(selectedNode,1.65);openSelectedBtn.onclick=()=>selectedNode&&openLightbox(selectedNode);relatedList.onclick=e=>{const x=e.target.closest("[data-node]");if(!x)return;const n=nodes.find(n=>n.id===Number(x.dataset.node));if(n)setSelected(n,true)};
function updateStats(){statCount.textContent=visibleNodes().length;statCopy.textContent=`photographs · ${edges.length} visible connections`}
function buildYears(){const years=[...new Set(photos.map(getYear).filter(Boolean))].sort();yearList.innerHTML=`<button class="year-btn active" data-year="all">ALL</button>`+years.map(y=>`<button class="year-btn" data-year="${y}">${y}</button>`).join("");yearList.onclick=e=>{const b=e.target.closest(".year-btn");if(!b)return;activeYear=b.dataset.year;document.querySelectorAll(".year-btn").forEach(x=>x.classList.toggle("active",x===b));activeYearLabel.textContent=activeYear==="all"?"ALL YEARS":activeYear;setSelected(null,false);buildEdges()}}
function toggleJourney(){journeyRunning=!journeyRunning;journeyBtn.textContent=journeyRunning?"■ STOP":"▶ JOURNEY";clearInterval(journeyTimer);journeyTimer=null;if(!journeyRunning)return;if(!selectedNode){const v=visibleNodes();if(v.length)setSelected(v[Math.floor(Math.random()*v.length)],true)}journeyTimer=setInterval(()=>{if(!selectedNode)return;const r=strongestConnections(selectedNode),v=visibleNodes(),next=r.length?r[Math.floor(Math.random()*Math.min(3,r.length))].node:v[Math.floor(Math.random()*v.length)];if(next)setSelected(next,true)},2300)}journeyBtn.onclick=toggleJourney;
const currentVisibleOrdered=()=>visibleNodes();function openLightbox(n){const l=currentVisibleOrdered();lightboxIndex=l.indexOf(n);if(lightboxIndex<0)return;lightbox.classList.add("open");renderLightbox()}function renderLightbox(){const l=currentVisibleOrdered(),n=l[lightboxIndex];if(!n)return;const p=n.photo;lightboxImage.src=photoUrl(p.filename);lbNumber.textContent=`${String(lightboxIndex+1).padStart(2,"0")} / ${String(l.length).padStart(2,"0")}`;lbDate.textContent=formatDate(p.date)||"Undated";lbMeta.innerHTML=[getLocation(p),getCamera(p),normalizeColor(p.color)].filter(Boolean).map(escapeHtml).join("<br>")}function moveLightbox(d){const l=currentVisibleOrdered();if(!l.length)return;lightboxIndex=(lightboxIndex+d+l.length)%l.length;renderLightbox()}lightboxClose.onclick=()=>lightbox.classList.remove("open");lbPrev.onclick=()=>moveLightbox(-1);lbNext.onclick=()=>moveLightbox(1);document.addEventListener("keydown",e=>{if(lightbox.classList.contains("open")){if(e.key==="Escape")lightbox.classList.remove("open");if(e.key==="ArrowLeft")moveLightbox(-1);if(e.key==="ArrowRight")moveLightbox(1);return}if(e.key==="Escape")setSelected(null,false)});

async function loadJson(file,fallback){try{const r=await fetch(`${file}?v=${Date.now()}`,{cache:"no-store"});return r.ok?await r.json():fallback}catch{return fallback}}
async function init(){resize();const site=await loadJson("site.json",{});brandMark.textContent=site.brandMark||"h.";brandName.textContent=site.brandName||"hamihamoo";brandSubtitle.textContent=site.brandSubtitle||"PHOTOGRAPHY";const [pd,pr]=await Promise.all([loadJson("photos.json",[]),loadJson("projects.json",[])]);photos=Array.isArray(pd)?pd:[];projects=Array.isArray(pr)?pr:[];buildProjectMaps();buildNodes();buildYears();buildEdges();camera={x:width/2,y:height/2,zoom:1};loading.classList.add("hide");loop()}
init();
</script>
