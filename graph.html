<style>

.actions,.mode-switch,.layer-bar,.year-list{display:flex;align-items:center}.actions{gap:8px}.btn,.mode-btn,.layer-btn,.year-btn{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.035);color:#b9c1c5}.btn:hover,.mode-btn:hover,.layer-btn:hover,.year-btn:hover{color:#fff;border-color:rgba(255,255,255,.32)}.btn{height:34px;padding:0 12px;font-size:9px}.btn.accent{color:#8aefa9;border-color:rgba(97,227,142,.34)}

<body>

<script>
const canvas=document.getElementById("graphCanvas"),ctx=canvas.getContext("2d");
let photos=[],projects=[],nodes=[],edges=[],projectMap=new Map(),photoProjectMap=new Map();
let activeYear="all",selectedNode=null,hoveredNode=null,currentSearch="";
let echoStart=0,frameNow=0;
let width=innerWidth,height=innerHeight,dpr=Math.max(1,Math.min(2,devicePixelRatio||1)),simulationTicks=0;
let camera={x:width/2,y:height/2,zoom:1};
let pointer={down:false,moved:false,lastX:0,lastY:0,x:0,y:0,active:false,id:null,type:"mouse",downNode:null,draggingNode:null,longPressTimer:null,moveX:0,moveY:0,lastMoveTime:0,speed:0,energy:0};
const activePointers=new Map();
let pinch={active:false,startDistance:0,startZoom:1,worldX:0,worldY:0};
let journeyTimer=null,journeyRunning=false,lightboxIndex=-1;

const safe=v=>String(v??"");
const photoUrl=f=>"images/digital/"+encodeURIComponent(f);
const formatDate=v=>safe(v).replace(/-/g,".");
const getYear=p=>(safe(p.date).match(/^(\d{4})/)||[])[1]||"";
const getLocation=p=>{const l=p.location||{};return l.displayName||[l.region,l.city,l.district,l.country].filter(Boolean).join(" ")||""};
const getLatLng=p=>{const l=p.location||{},lat=Number(l.latitude),lng=Number(l.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null};
const getCamera=p=>{const t=safe(p.info).trim(),m=t.match(/\bf\d+(\.\d+)?\b/i);return m?(t.slice(0,m.index).trim()||t):(t||"-")};
const normalizeColor=v=>{const x=safe(v).trim();if(/^#[0-9a-f]{6}$/i.test(x))return x;if(/^#[0-9a-f]{3}$/i.test(x))return "#"+x.slice(1).split("").map(c=>c+c).join("");const n={red:"#b65a52",orange:"#c77d42",yellow:"#c8b653",green:"#5f8d67",blue:"#5c7899",purple:"#7b668d",pink:"#b87c8d",brown:"#7f6754",black:"#3d4143",white:"#d9d9d3",gray:"#858b8e",grey:"#858b8e"};return n[x.toLowerCase()]||"#9aa3a8"};
const hexToRgb=h=>{h=normalizeColor(h).slice(1);return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}};
const colorDistance=(a,b)=>{const x=hexToRgb(a),y=hexToRgb(b);return Math.hypot(x.r-y.r,x.g-y.g,x.b-y.b)};


function relationReason(e){
    const parts=[];
    if(e.project>0)parts.push("same project");
    if(e.place>0)parts.push("same place");
    if(e.date>=5)parts.push("same day");
    else if(e.date>=2)parts.push("same month");
    if(e.color>=3)parts.push("very similar color");
    else if(e.color>0)parts.push("similar color");
    if(e.exif>0)parts.push("same camera");
    return parts.join(" · ");
}

const projectIdsFor=f=>photoProjectMap.get(f)||[];
const sameProject=(a,b)=>{const s=new Set(projectIdsFor(a.filename));return projectIdsFor(b.filename).some(id=>s.has(id))};
const samePlace=(a,b)=>{const x=getLocation(a),y=getLocation(b);return x&&y&&x===y};
function dateScore(a,b){const x=safe(a.date),y=safe(b.date);if(!x||!y)return 0;if(x===y)return 5;if(x.slice(0,7)===y.slice(0,7))return 2.2;if(x.slice(0,4)===y.slice(0,4))return .6;return 0}
function relation(a,b,L=layer){const d=dateScore(a,b),p=samePlace(a,b)?5:0,j=sameProject(a,b)?6:0,cd=colorDistance(a.color,b.color),c=cd<55?3.2:cd<90?1.8:cd<125?.7:0,e=getCamera(a)===getCamera(b)?1.5:0;let w=0;if(L==="all")w=d+p+j+c+e;if(L==="date")w=d;if(L==="place")w=p;if(L==="project")w=j;if(L==="color")w=c;if(L==="exif")w=e;return{weight:w,date:d,place:p,project:j,color:c,exif:e}}
const visibleNodes=()=>nodes.filter(n=>activeYear==="all"||getYear(n.photo)===activeYear);
function searchMatch(n){if(!currentSearch)return true;const p=n.photo,pt=projectIdsFor(p.filename).map(id=>projectMap.get(id)?.title||"").join(" ");return[p.filename,p.date,p.info,p.color,getLocation(p),pt].filter(Boolean).join(" ").toLowerCase().includes(currentSearch)}

function buildProjectMaps(){projectMap.clear();photoProjectMap.clear();projects.forEach(p=>{projectMap.set(p.id,p);(p.photos||[]).forEach(f=>{if(!photoProjectMap.has(f))photoProjectMap.set(f,[]);photoProjectMap.get(f).push(p.id)})})}
function buildNodes(){
    nodes=photos.map((photo,id)=>{
        const a=Math.random()*Math.PI*2;
        const r=170+Math.sqrt(Math.random())*390;
        const x=Math.cos(a)*r;
        const y=Math.sin(a)*r;
        return{
            id,photo,
            x,y,homeX:x,homeY:y,
            vx:0,vy:0,
            ox:0,oy:0,ovx:0,ovy:0
        };
    });
}
function buildEdges(){
    const v=visibleNodes(),c=[];
    for(let i=0;i<v.length;i++){
        for(let j=i+1;j<v.length;j++){
            const rel=relation(v[i].photo,v[j].photo,"all");
            if(rel.weight>0)c.push({a:v[i],b:v[j],seed:Math.random(),...rel});
        }
    }
    c.sort((a,b)=>b.weight-a.weight);

    const deg=new Map();
    edges=[];

    for(const e of c){
        const da=deg.get(e.a.id)||0;
        const db=deg.get(e.b.id)||0;
        if(e.weight<2.2)continue;

        if(da<4&&db<4){
            edges.push(e);
            deg.set(e.a.id,da+1);
            deg.set(e.b.id,db+1);
        }
    }

    simulationTicks=0;
    updateStats();
}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.max(1,Math.min(2,devicePixelRatio||1));canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+"px";canvas.style.height=height+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener("resize",resize);
const worldToScreen=(x,y)=>({x:x*camera.zoom+camera.x,y:y*camera.zoom+camera.y});
const screenToWorld=(x,y)=>({x:(x-camera.x)/camera.zoom,y:(y-camera.y)/camera.zoom});
function animateCamera(target,d=500){const s={...camera},t0=performance.now();function f(now){const t=Math.min(1,(now-t0)/d),e=1-Math.pow(1-t,3);camera.x=s.x+(target.x-s.x)*e;camera.y=s.y+(target.y-s.y)*e;camera.zoom=s.zoom+(target.zoom-s.zoom)*e;if(t<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function resetCamera(){animateCamera({x:width/2,y:height/2,zoom:1})}
function centerOnNode(n,z=Math.max(camera.zoom,1.35)){animateCamera({x:width/2-n.x*z,y:height/2-n.y*z,zoom:z},600)}


function updateCursorOffsets(){
    const spring=.21;
    const damping=.70;
    const maxScreenOffset=32;

    nodes.forEach(n=>{
        if(n===pointer.draggingNode){
            n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;
            return;
        }

        n.ovx=(n.ovx||0)-(n.ox||0)*spring;
        n.ovy=(n.ovy||0)-(n.oy||0)*spring;
        n.ovx*=damping;
        n.ovy*=damping;
        n.ox=(n.ox||0)+n.ovx;
        n.oy=(n.oy||0)+n.ovy;

        const maxWorld=maxScreenOffset/Math.max(.45,camera.zoom);
        const d=Math.hypot(n.ox,n.oy);
        if(d>maxWorld){
            n.ox=n.ox/d*maxWorld;
            n.oy=n.oy/d*maxWorld;
        }

        if(Math.abs(n.ox)<.002&&Math.abs(n.oy)<.002&&Math.abs(n.ovx)<.002&&Math.abs(n.ovy)<.002){
            n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;
        }
    });

    pointer.energy*=.84;
    if(pointer.energy<.01)pointer.energy=0;
}

function simulate(){
    const v=visibleNodes();
    if(!v.length)return;

    updateCursorOffsets();

    simulationTicks++;
    const settling=simulationTicks<360;

    // 핵심: 화면 중앙을 향한 중력은 사용하지 않는다.
    // 각 노드는 자신의 home 위치를 중심으로 아주 약하게 복원된다.
    v.forEach(n=>{
        if(n===pointer.draggingNode)return;
        n.vx+=(n.homeX-n.x)*.0022;
        n.vy+=(n.homeY-n.y)*.0022;
    });

    if(settling){
        // 가까운 노드끼리 겹치지 않게 밀어냄.
        for(let i=0;i<v.length;i++){
            for(let j=i+1;j<v.length;j++){
                const A=v[i],B=v[j];
                if(A===pointer.draggingNode||B===pointer.draggingNode)continue;

                let dx=B.x-A.x,dy=B.y-A.y;
                let d2=dx*dx+dy*dy+.1;
                if(d2>42000)continue;

                const dist=Math.sqrt(d2);
                const force=1150/d2;
                dx/=dist;dy/=dist;

                A.vx-=dx*force;A.vy-=dy*force;
                B.vx+=dx*force;B.vy+=dy*force;
            }
        }

        // 연결 관계는 아주 약하게만 당긴다.
        edges.forEach(e=>{
            let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y;
            const dist=Math.hypot(dx,dy)||1;
            const target=145;
            const f=(dist-target)*.00016*Math.min(3,e.weight);

            dx/=dist;dy/=dist;
            if(e.a!==pointer.draggingNode){e.a.vx+=dx*f;e.a.vy+=dy*f}
            if(e.b!==pointer.draggingNode){e.b.vx-=dx*f;e.b.vy-=dy*f}
        });
    }

    v.forEach(n=>{
        if(n===pointer.draggingNode)return;
        n.vx*=.80;
        n.vy*=.80;
        n.x+=n.vx;
        n.y+=n.vy;
    });
}
function drawPointerField(){
    if(pointer.energy<=0||pointer.type!=="mouse"||pointer.down||pinch.active)return;

    const r=72+pointer.energy*46;
    const a=.014+.038*pointer.energy;
    const g=ctx.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,r);
    g.addColorStop(0,`rgba(97,227,142,${a})`);
    g.addColorStop(.55,`rgba(97,227,142,${a*.32})`);
    g.addColorStop(1,"rgba(97,227,142,0)");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(pointer.x,pointer.y,r,0,Math.PI*2);
    ctx.fill();
}
function drawBackground(){ctx.clearRect(0,0,width,height)}
function drawNebula(){if(camera.zoom<.55)return;visibleNodes().forEach((n,i)=>{if(i%3)return;const p=worldToScreen(n.x,n.y),rgb=hexToRgb(n.photo.color),r=38*camera.zoom,g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(${rgb.r},${rgb.g},${rgb.b},.045)`);g.addColorStop(1,`rgba(${rgb.r},${rgb.g},${rgb.b},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill()})}
function drawEdges(){
    const vis=new Set(visibleNodes().map(n=>n.id));
    edges.forEach(e=>{
        if(!vis.has(e.a.id)||!vis.has(e.b.id))return;

        const a=screenPosition(e.a),b=screenPosition(e.b);
        const sel=selectedNode&&(e.a===selectedNode||e.b===selectedNode);
        const dim=selectedNode&&!sel;

        let alpha=Math.min(.31,.05+e.weight*.017);
        if(sel)alpha=.62;
        if(dim)alpha*=.15;

        ctx.strokeStyle=sel?`rgba(112,235,149,${alpha})`:`rgba(184,196,202,${alpha})`;
        ctx.lineWidth=sel?1.1:.65;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
    });
}
function drawEdgeParticles(now){
    const vis=new Set(visibleNodes().map(n=>n.id));
    const limit=Math.min(edges.length,130);
    for(let i=0;i<limit;i++){
        const e=edges[i];
        if(!vis.has(e.a.id)||!vis.has(e.b.id))continue;
        if(selectedNode&&e.a!==selectedNode&&e.b!==selectedNode&&i%3!==0)continue;

        const a=screenPosition(e.a,now),b=screenPosition(e.b,now);
        const speed=.000035+Math.min(.000075,e.weight*.000006);
        const t=(e.seed+now*speed)%1;
        const x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
        const selected=e.a===selectedNode||e.b===selectedNode;

        ctx.fillStyle=selected?"rgba(116,239,153,.82)":"rgba(202,214,219,.30)";
        ctx.beginPath();
        ctx.arc(x,y,selected?1.7:1.05,0,Math.PI*2);
        ctx.fill();
    }
}
function drawClusters(){}
function drawNodes(now=frameNow){
    visibleNodes().forEach((n,i)=>{
        const w={x:n.x+(n.ox||0),y:n.y+(n.oy||0)};
        const p=worldToScreen(w.x,w.y);

        if(p.x<-40||p.x>width+40||p.y<50||p.y>height+40)return;

        const match=searchMatch(n);
        const sel=selectedNode===n;
        const hover=hoveredNode===n;
        let alpha=match?.92:.10;

        if(selectedNode&&!sel){
            const connected=edges.some(e=>
                (e.a===selectedNode&&e.b===n)||
                (e.b===selectedNode&&e.a===n)
            );
            alpha*=connected?.95:.22;
        }

        const rgb=hexToRgb(n.photo.color);
        const echo=echoStrength(n,now);
        const r=(sel?7.4:hover?5.8:3.2)*Math.max(.78,Math.min(1.45,camera.zoom));

        if(echo>0){
            ctx.strokeStyle=`rgba(97,227,142,${.40*echo})`;
            ctx.lineWidth=1;
            ctx.beginPath();
            ctx.arc(p.x,p.y,10+echo*15,0,Math.PI*2);
            ctx.stroke();
        }

        if(sel||hover||echo>0){
            ctx.fillStyle=`rgba(${rgb.r},${rgb.g},${rgb.b},${.10+echo*.10})`;
            ctx.beginPath();
            ctx.arc(p.x,p.y,r*(3.0+echo),0,Math.PI*2);
            ctx.fill();
        }

        ctx.fillStyle=sel
            ? "rgba(97,227,142,1)"
            : `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;

        ctx.beginPath();
        ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fill();

        if(camera.zoom>2.1&&match&&i%4===0){
            ctx.fillStyle="rgba(255,255,255,.28)";
            ctx.font="7px Arial";
            ctx.fillText(formatDate(n.photo.date),p.x+7,p.y+3);
        }
    });
}
function loop(now=performance.now()){frameNow=now;simulate();drawBackground();drawNebula();drawEdges();drawEdgeParticles(now);drawPointerField();drawClusters();drawNodes(now);requestAnimationFrame(loop)}
function hitTest(x,y){
    let best=null,bd=Infinity;
    for(const n of visibleNodes()){
        const p=worldToScreen(n.x+(n.ox||0),n.y+(n.oy||0));
        const d=Math.hypot(x-p.x,y-p.y);
        const limit=Math.max(11,8*camera.zoom);
        if(d<limit&&d<bd){best=n;bd=d}
    }
    return best;
}
function tooltipFor(n,x,y){const t=document.getElementById("tooltip");if(!n){t.classList.remove("show");return}document.getElementById("tooltipImage").src=photoUrl(n.photo.filename);document.getElementById("tooltipDate").textContent=formatDate(n.photo.date)||"Undated";document.getElementById("tooltipCopy").textContent=[getLocation(n.photo),getCamera(n.photo)].filter(Boolean).join(" · ");t.style.left=Math.min(width-184,x+14)+"px";t.style.top=Math.min(height-160,y+14)+"px";t.classList.add("show")}
const strongestConnections=n=>edges.filter(e=>e.a===n||e.b===n).map(e=>({node:e.a===n?e.b:e.a,weight:e.weight,edge:e})).sort((a,b)=>b.weight-a.weight);
function setSelected(n,center=true){
    selectedNode=n;
    echoStart=performance.now();

    if(!n){
        document.getElementById("infoPanel").classList.remove("open");
        return;
    }

    if(center)centerOnNode(n);
    const p=n.photo,ids=projectIdsFor(p.filename),rel=strongestConnections(n);

    panelImage.src=photoUrl(p.filename);
    panelNumber.textContent=`PHOTO ${String(n.id+1).padStart(3,"0")}`;
    panelDate.textContent=formatDate(p.date)||"Undated";
    panelLocation.textContent=getLocation(p)||"Location unavailable";
    panelCamera.textContent=getCamera(p);
    panelColor.textContent=normalizeColor(p.color);

    const reasons=rel.slice(0,3).map(x=>relationReason(x.edge)).filter(Boolean);
    panelConnections.textContent=reasons.length?reasons.join(" / "):`${rel.length} strongest`;

    panelProjects.innerHTML=ids.map(id=>`<span class="chip">${escapeHtml(projectMap.get(id)?.title||"Project")}</span>`).join("");
    relatedList.innerHTML=rel.slice(0,6).map(x=>`<div data-node="${x.node.id}" title="${escapeHtml(relationReason(x.edge))}"><img src="${photoUrl(x.node.photo.filename)}" alt=""></div>`).join("");
    infoPanel.classList.add("open");
}
function escapeHtml(v){return safe(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function clearLongPress(){if(pointer.longPressTimer){clearTimeout(pointer.longPressTimer);pointer.longPressTimer=null}}
function startNodeDrag(n){if(!n)return;pointer.draggingNode=n;n.vx=0;n.vy=0;n.ox=0;n.oy=0;n.ovx=0;n.ovy=0;simulationTicks=0;canvas.classList.add("dragging")}
function stopNodeDrag(){if(pointer.draggingNode){pointer.draggingNode.vx=0;pointer.draggingNode.vy=0;pointer.draggingNode=null;simulationTicks=0}canvas.classList.remove("dragging")}
function beginPinch(){if(activePointers.size<2)return;const pts=[...activePointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,w=screenToWorld(cx,cy);pinch={active:true,startDistance:Math.max(1,Math.hypot(dx,dy)),startZoom:camera.zoom,worldX:w.x,worldY:w.y};clearLongPress();stopNodeDrag();pointer.moved=true}
function updatePinch(){if(!pinch.active||activePointers.size<2)return;const pts=[...activePointers.values()].slice(0,2),dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2,dist=Math.max(1,Math.hypot(dx,dy)),z=Math.max(.28,Math.min(4.2,pinch.startZoom*(dist/pinch.startDistance)));camera.zoom=z;camera.x=cx-pinch.worldX*z;camera.y=cy-pinch.worldY*z}
canvas.addEventListener("pointerdown",e=>{
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});canvas.setPointerCapture(e.pointerId);
    pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;pointer.type=e.pointerType||"mouse";
    if(activePointers.size===2){beginPinch();return}
    pointer.down=true;pointer.id=e.pointerId;pointer.moved=false;pointer.lastX=e.clientX;pointer.lastY=e.clientY;pointer.downNode=hitTest(e.clientX,e.clientY);
    if(pointer.type==="mouse"&&pointer.downNode)startNodeDrag(pointer.downNode);
    else if(pointer.type==="touch"&&pointer.downNode){clearLongPress();pointer.longPressTimer=setTimeout(()=>{if(pointer.down&&!pointer.moved&&activePointers.size===1){startNodeDrag(pointer.downNode);if(navigator.vibrate)navigator.vibrate(12)}},280)}
});
canvas.addEventListener("pointermove",e=>{
    if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});

    const now=performance.now();
    const prevX=pointer.x,prevY=pointer.y;
    const dt=pointer.lastMoveTime?now-pointer.lastMoveTime:16;
    const mdx=e.clientX-prevX,mdy=e.clientY-prevY;

    pointer.x=e.clientX;
    pointer.y=e.clientY;
    pointer.active=true;
    pointer.type=e.pointerType||pointer.type;
    pointer.lastMoveTime=now;

    if(pointer.type==="mouse"&&!pointer.down&&activePointers.size<2){
        applyCursorSweepImpulse(e.clientX,e.clientY,mdx,mdy,dt);
    }
    if(activePointers.size>=2){if(!pinch.active)beginPinch();updatePinch();tooltipFor(null);return}
    if(pointer.draggingNode&&pointer.id===e.pointerId){const dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;if(Math.abs(dx)+Math.abs(dy)>2)pointer.moved=true;const w=screenToWorld(e.clientX,e.clientY);pointer.draggingNode.x=w.x;pointer.draggingNode.y=w.y;pointer.draggingNode.vx=0;pointer.draggingNode.vy=0;pointer.lastX=e.clientX;pointer.lastY=e.clientY;tooltipFor(null);return}
    if(pointer.down&&pointer.id===e.pointerId){const dx=e.clientX-pointer.lastX,dy=e.clientY-pointer.lastY;if(Math.abs(dx)+Math.abs(dy)>2){pointer.moved=true;clearLongPress()}camera.x+=dx;camera.y+=dy;pointer.lastX=e.clientX;pointer.lastY=e.clientY;tooltipFor(null);return}
    hoveredNode=hitTest(e.clientX,e.clientY);tooltipFor(hoveredNode,e.clientX,e.clientY)
});
function finishPointer(e,cancelled=false){clearLongPress();const pinching=pinch.active;activePointers.delete(e.pointerId);if(pinching){if(activePointers.size<2)pinch.active=false;pointer.down=false;pointer.id=null;pointer.downNode=null;stopNodeDrag();return}const dragged=pointer.draggingNode,moved=pointer.moved;if(dragged){stopNodeDrag();if(!moved&&!cancelled)setSelected(dragged,true)}else if(pointer.down&&pointer.id===e.pointerId&&!moved&&!cancelled){const n=hitTest(e.clientX,e.clientY);n?setSelected(n,true):setSelected(null,false)}pointer.down=false;pointer.id=null;pointer.downNode=null;if(e.pointerType==="touch"){pointer.active=false;hoveredNode=null;tooltipFor(null)}}
canvas.addEventListener("pointerup",e=>finishPointer(e,false));
canvas.addEventListener("pointercancel",e=>finishPointer(e,true));
canvas.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!pointer.down){pointer.active=false;pointer.energy=0;pointer.speed=0;hoveredNode=null;tooltipFor(null)}});
canvas.addEventListener("dblclick",e=>{const n=hitTest(e.clientX,e.clientY);if(n)openLightbox(n)});
canvas.addEventListener("wheel",e=>{e.preventDefault();const before=screenToWorld(e.clientX,e.clientY),f=e.deltaY>0?.9:1.1;camera.zoom=Math.max(.28,Math.min(4.2,camera.zoom*f));const after=worldToScreen(before.x,before.y);camera.x+=e.clientX-after.x;camera.y+=e.clientY-after.y},{passive:false});

searchInput.oninput=e=>currentSearch=e.target.value.trim().toLowerCase();searchClear.onclick=()=>{currentSearch="";searchInput.value=""};centerBtn.onclick=resetCamera;clusterBtn.onclick=e=>{showClusters=!showClusters;e.currentTarget.classList.toggle("accent",showClusters)};fullscreenBtn.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
panelClose.onclick=()=>setSelected(null,false);focusSelectedBtn.onclick=()=>selectedNode&&centerOnNode(selectedNode,1.65);openSelectedBtn.onclick=()=>selectedNode&&openLightbox(selectedNode);relatedList.onclick=e=>{const x=e.target.closest("[data-node]");if(!x)return;const n=nodes.find(n=>n.id===Number(x.dataset.node));if(n)setSelected(n,true)};
function updateStats(){statCount.textContent=visibleNodes().length;statCopy.textContent=`photographs · ${edges.length} connections`}
function buildYears(){const years=[...new Set(photos.map(getYear).filter(Boolean))].sort();yearList.innerHTML=`<button class="year-btn active" data-year="all">ALL</button>`+years.map(y=>`<button class="year-btn" data-year="${y}">${y}</button>`).join("");yearList.onclick=e=>{const b=e.target.closest(".year-btn");if(!b)return;activeYear=b.dataset.year;document.querySelectorAll(".year-btn").forEach(x=>x.classList.toggle("active",x===b));activeYearLabel.textContent=activeYear==="all"?"ALL YEARS":activeYear;buildEdges();updateMapTargets();setSelected(null,false)}}
function toggleJourney(){journeyRunning=!journeyRunning;journeyBtn.textContent=journeyRunning?"■ STOP":"▶ JOURNEY";clearInterval(journeyTimer);journeyTimer=null;if(!journeyRunning)return;if(!selectedNode){const v=visibleNodes();if(v.length)setSelected(v[Math.floor(Math.random()*v.length)],true)}journeyTimer=setInterval(()=>{if(!selectedNode)return;const r=strongestConnections(selectedNode),v=visibleNodes(),next=r.length?r[Math.floor(Math.random()*Math.min(3,r.length))].node:v[Math.floor(Math.random()*v.length)];if(next)setSelected(next,true)},2300)}journeyBtn.onclick=toggleJourney;
const currentVisibleOrdered=()=>visibleNodes();function openLightbox(n){const l=currentVisibleOrdered();lightboxIndex=l.indexOf(n);if(lightboxIndex<0)return;lightbox.classList.add("open");renderLightbox()}function renderLightbox(){const l=currentVisibleOrdered(),n=l[lightboxIndex];if(!n)return;const p=n.photo;lightboxImage.src=photoUrl(p.filename);lbNumber.textContent=`${String(lightboxIndex+1).padStart(2,"0")} / ${String(l.length).padStart(2,"0")}`;lbDate.textContent=formatDate(p.date)||"Undated";lbMeta.innerHTML=[getLocation(p),getCamera(p),normalizeColor(p.color)].filter(Boolean).map(escapeHtml).join("<br>")}function moveLightbox(d){const l=currentVisibleOrdered();if(!l.length)return;lightboxIndex=(lightboxIndex+d+l.length)%l.length;renderLightbox()}lightboxClose.onclick=()=>lightbox.classList.remove("open");lbPrev.onclick=()=>moveLightbox(-1);lbNext.onclick=()=>moveLightbox(1);document.addEventListener("keydown",e=>{if(lightbox.classList.contains("open")){if(e.key==="Escape")lightbox.classList.remove("open");if(e.key==="ArrowLeft")moveLightbox(-1);if(e.key==="ArrowRight")moveLightbox(1);return}if(e.key==="Escape")setSelected(null,false)});

async function loadJson(file,fallback){try{const r=await fetch(`${file}?v=${Date.now()}`,{cache:"no-store"});return r.ok?await r.json():fallback}catch{return fallback}}
async function init(){resize();const site=await loadJson("site.json",{});brandMark.textContent=site.brandMark||"h.";brandName.textContent=site.brandName||"hamihamoo";brandSubtitle.textContent=site.brandSubtitle||"PHOTOGRAPHY";const [pd,pr]=await Promise.all([loadJson("photos.json",[]),loadJson("projects.json",[])]);photos=Array.isArray(pd)?pd:[];projects=Array.isArray(pr)?pr:[];buildProjectMaps();buildNodes();buildYears();buildEdges();camera={x:width/2,y:height/2,zoom:1};loading.classList.add("hide");loop()}
init();
</script>
